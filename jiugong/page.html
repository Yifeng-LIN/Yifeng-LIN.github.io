<title>我的三地世界</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a field-station logbook. Live map on the left, the rulebook on the right, the ledger of results underneath. */

  --bg:#eef1ec; --panel:#fbfcf9; --ink:#1d2621; --muted:#5d6a62; --line:#d3dbd2; --soft:#f1f4ee;

  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --panel:#19211d; --ink:#e3ebe5; --muted:#97a69d; --line:#2c3832; --soft:#1f2924;
  --accent:#8cc7b2; --kid:#f0a35e; --parent:#6cbcdf; --good:#5cc985; --warn:#e3b54a; --bad:#f07563; --hubc:#9aa7ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --panel:#19211d; --ink:#e3ebe5; --muted:#97a69d; --line:#2c3832; --soft:#1f2924;
  --accent:#8cc7b2; --kid:#f0a35e; --parent:#6cbcdf; --good:#5cc985; --warn:#e3b54a; --bad:#f07563; --hubc:#9aa7ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4.6vw,42px);line-height:1.1;margin:0;letter-spacing:2px}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;letter-spacing:.5px}
h3{font-size:12.5px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.06em}
.date{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-variant-numeric:tabular-nums}
.date b{font-family:var(--f-display);font-size:24px;color:var(--accent);font-weight:600}
.date span{font-size:12.5px;color:var(--muted)}
.top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:940px){.top{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
#map{width:100%;aspect-ratio:5/6;max-width:100%;display:block;border-radius:14px;background:#3c4a3a;cursor:pointer;touch-action:manipulation}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.grp{display:flex;flex-direction:column;gap:7px}

.kid .who{background:var(--kid)} .parent .who{background:var(--parent)}
.slider{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3.6em;gap:10px;align-items:center;font-size:13px}
.slider input{width:100%;accent-color:var(--accent)}
.slider output{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
textarea{width:100%;min-height:58px;resize:vertical;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--soft);color:var(--ink)}

.who-toggle button[data-r="parent"][aria-pressed="true"]{border-color:var(--parent);color:var(--parent)}
.note{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 10px;border-bottom:2.5px solid transparent;color:var(--muted);font-weight:500}

.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:3px 16px;font-variant-numeric:tabular-nums;font-size:13.5px}
.kv span b{font-weight:700}
.flow{font-size:13px;display:flex;flex-direction:column;gap:3px}
.flow span{color:var(--muted)}
.table-wrap{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.8px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel)}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--soft)}
.pill{display:inline-block;min-width:40px;padding:0 6px;border-radius:6px;text-align:center}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent)}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.pill.bad{background:color-mix(in srgb,var(--bad) 22%,transparent)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:5px;color:var(--panel);margin-left:3px}
.tag.bad{background:var(--bad)} .tag.warn{background:var(--warn)} .tag.info{background:var(--muted)} .tag.good{background:var(--good)}
.person h4{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600}
.person ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.verdict{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;border-radius:14px;padding:12px 18px;border:2px solid var(--line);background:var(--panel)}
.verdict .face{font-family:var(--f-display);font-size:25px;font-weight:900}
.verdict.good{border-color:var(--good)} .verdict.good .face{color:var(--good)}
.verdict.warn{border-color:var(--warn)} .verdict.warn .face{color:var(--warn)}
.verdict.bad{border-color:var(--bad)} .verdict.bad .face{color:var(--bad)}
.verdict p{margin:0;flex:1 1 320px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.stat .d{font-size:12px;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:940px){.charts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.chart canvas{width:100%;height:150px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.lower{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,0.9fr);gap:14px;align-items:start}
@media (max-width:1050px){.lower{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:700px){.lower{grid-template-columns:minmax(0,1fr)}}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto}
.finds li{padding:8px 11px;border-radius:9px;background:var(--soft);border-left:4px solid var(--line);font-size:13.5px}
.finds li.good{border-left-color:var(--good)} .finds li.warn{border-left-color:var(--warn)} .finds li.bad{border-left-color:var(--bad)}
.news li,.log li{font-size:13px;padding:6px 9px;border-radius:8px;background:var(--soft)}
.news li .t,.log li .t{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;margin-right:6px}
.news li.bad{box-shadow:inset 3px 0 0 var(--bad)} .news li.good{box-shadow:inset 3px 0 0 var(--good)} .news li.info{box-shadow:inset 3px 0 0 var(--muted)}
.rtag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:5px;color:var(--panel);margin-right:5px}
.rtag.kid{background:var(--kid)} .rtag.parent{background:var(--parent)} .rtag.sys{background:var(--muted)}
.log .ex{display:block;color:var(--muted);margin-top:2px}
.ai{white-space:pre-wrap;font-size:13.5px;background:var(--soft);border-radius:9px;padding:9px 11px}
.diag{display:flex;flex-direction:column;gap:12px}
.probs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.prob{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:6px 10px;align-items:baseline}
.prob.bad{border-left-color:var(--bad)} .prob.good{border-left-color:var(--good)}
.prob .k{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.prob .q{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.35}
.prob .v{font-size:14px}
.prob .trend{grid-column:2;font-size:12px;color:var(--muted)}
.logbox summary{cursor:pointer;font-weight:600}
.close{margin-left:auto;border:0;background:none;color:var(--muted);padding:6px 4px;order:9}
.tabs{align-items:center}
.reps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.reps{grid-template-columns:minmax(0,1fr)}.rep{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:0 10px;align-items:center;padding:6px 10px}.rep .no{grid-row:1/4}}
.rep{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;background:var(--soft);text-align:left}
.rep:hover{border-color:var(--accent)}
.rep .no{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:2px solid currentColor;font-family:var(--f-display);font-weight:900;font-size:14px}
.rep .rn{font-family:var(--f-display);font-weight:600;font-size:16px}
.rep .rw{font-size:12px;color:var(--muted)}
.rep .rbio{font-size:12.5px}
.rep.mountain{color:#6b7280}.rep.village{color:#4c8a3c}.rep.coast{color:#2a79a8}
.rep>*:not(.no){color:var(--ink)}.rep .rw{color:var(--muted)}
.vbar{display:grid;grid-template-columns:2.2em 4.6em minmax(0,1fr) 2.6em;gap:6px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.vbar i{display:block;height:10px;border-radius:5px;background:var(--line)}
.vbar.won i{background:var(--accent)}
.vbar.won b{border:2px solid var(--accent);border-radius:50%;padding:0 5px}
.vbars{display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <header>
    <div><h1 id="ttl">我的三地世界</h1><p class="sub">山区有矿，乡村有稻田，海边有鱼和贝壳。三个地区各选一位代表来管事。这里只显示模拟的结果：出了什么问题、卡在哪里、会造成什么后果。</p></div>
    <div class="date"><b id="date">—</b><span id="dateSub"></span></div>
  </header>
  <section class="top">
    <div class="col">
      <canvas id="map" aria-label="三个地区的地图：上面是山区，中间是乡村，下面是海边"></canvas>
      <div class="bar"><button class="btn primary" id="play">▶ 播放</button><button class="btn" id="speed">速度 4×</button><button class="btn" id="home">回到开头</button><span class="note" id="note"></span></div>
      <input type="range" id="pos" min="0" max="0" value="0" aria-label="时间">
    </div>
    <div class="col">
      <div class="panel"><h2>三位代表</h2><div class="reps" id="reps"></div></div>
      <div class="panel"><h2>现在的规则</h2><div class="chips" id="now"></div></div>
      <div class="panel"><h2>改过的规则</h2><ul class="list log" id="rl"></ul></div>
    </div>
  </section>
  <section class="diag"><div class="verdict" id="verdict"><div class="face" id="vFace">—</div><p id="vText"></p></div><div class="probs" id="probs"></div></section>
</div>

<script>
(()=>{

const SEASON=['春','夏','秋','冬'],MODES=['free','barter','money'];
let D=null,wk=0,running=false,speed=4,timer=null,PROBS=[],sel=null,reps=[],G={},EVN={},JOB={};
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches,Sim={candOf:w=>w.rep},tickMs=()=>1300/speed;let lastTick=performance.now();
const S={t:0,flow:[],worlds:[['mountain','山区',6],['village','乡村',7],['coast','海边',9]].map(([id,name,no],i)=>({id,name,no,i,hhs:{length:0},working:0,event:null,rep:{name:'—'}}))};
// ================= the map: mountain on top, village in the middle, coast at the bottom =================
const cv=$('#map'),cx=cv.getContext('2d');let DPR=1,SW=600,SH=720;const cache=new Map();
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);SW=r.width||600;SH=SW*1.2;cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);cache.clear()}
const HALL={mountain:[0.30,0.25],village:[0.60,0.49],coast:[0.58,0.775]};
const ROADS={mv:[[0.30,0.25],[0.38,0.34],[0.50,0.41],[0.60,0.49]],vc:[[0.60,0.49],[0.64,0.60],[0.62,0.70],[0.58,0.775]]};
const RIVER=[[0.80,0.06],[0.72,0.2],[0.82,0.36],[0.74,0.52],[0.80,0.68],[0.78,0.86]];
const CLUSTER={mountain:[0.10,0.19,0.42,0.13],village:[0.55,0.39,0.38,0.2],coast:[0.30,0.69,0.6,0.08]};
const WORK={mountain:[[0.42,0.08,0.26,0.1],[0.03,0.13,0.2,0.2],[0.68,0.18,0.28,0.15]],village:[[0.04,0.38,0.46,0.26]],coast:[[0.04,0.88,0.8,0.1],[0.05,0.74,0.24,0.07],[0.1,0.82,0.7,0.035]]};
function hash(i,s){let n=(i*374761393+s*668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
function rngFor(id,k=0){let a=[...id].reduce((s,c)=>s*31+c.charCodeAt(0),7)+k*977;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function vnoise(x,y,s){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,sm=t=>t*t*(3-2*t);const a=hash(i+j*57,s),b=hash(i+1+j*57,s),c=hash(i+(j+1)*57,s),d=hash(i+1+(j+1)*57,s);const u=sm(fx),v=sm(fy);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y,s)=>vnoise(x,y,s)*0.6+vnoise(x*2.1,y*2.1,s+3)*0.28+vnoise(x*4.3,y*4.3,s+7)*0.12;
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));

function distSeg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],t=clamp(((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(px-a[0]-dx*t,py-a[1]-dy*t)}
const riverDist=(u,v)=>{let m=9;for(let i=1;i<RIVER.length;i++)m=Math.min(m,distSeg(u,v,RIVER[i-1],RIVER[i]));return m};
function groundImage(se){const NX=84,NY=100,c=document.createElement('canvas');c.width=NX;c.height=NY;const g=c.getContext('2d'),im=g.createImageData(NX,NY);
  for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){const u=i/NX,v=j/NY,n=fbm(u*5,v*6,11+se);let col;
    const wM=clamp((0.38-v)/0.1,0,1),wC=clamp((v-0.66)/0.08,0,1);
    const grass=mix(GRASS[se],mix(GRASS[se],[30,50,25],0.35),clamp(n*1.3-0.25,0,1));
    const rock=se===3?mix([232,235,238],[190,196,204],n):mix([150,150,138],[104,106,98],clamp(n*1.4-0.2,0,1));
    col=mix(grass,mix(grass,rock,0.85),wM);
    if(wC>0){const sand=se===3?mix([232,228,214],[210,205,190],n):mix([230,212,164],[204,184,134],n);col=mix(col,sand,wC)}
    if(v>coastY(u)){const d=(v-coastY(u))/0.15;col=mix(se===3?[110,150,176]:[84,166,200],se===3?[58,96,128]:[30,98,150],clamp(d*1.2,0,1))}
    const rd=riverDist(u,v);if(rd<0.016&&v<coastY(u))col=mix(col,se===3?[190,214,230]:[70,150,196],clamp(1-rd/0.016,0,1)*0.95);

    if(w.event){const lbl=EVN[w.event]+'！';cx.font=`700 ${fs*0.85}px sans-serif`;const tw=cx.measureText(lbl).width+fs*0.8;cx.fillStyle=w.event==='bumper'?'#2e8a4e':'#c2412f';cx.beginPath();cx.roundRect?cx.roundRect(SW-tw-8,y0*SH,tw,fs*1.4,5):cx.rect(SW-tw-8,y0*SH,tw,fs*1.4);cx.fill();cx.fillStyle='#fff';cx.fillText(lbl,SW-tw-8+fs*0.4,y0*SH+fs*0.25)}
    if(sel===w.id){const yy0=w.i===0?0:w.i===1?0.36:0.7,yy1=w.i===0?0.36:w.i===1?0.7:1;cx.strokeStyle='#f6d34a';cx.lineWidth=3;cx.strokeRect(2,yy0*SH+2,SW-4,(yy1-yy0)*SH-4)}});
  requestAnimationFrame(frame)}

const when=t=>`第${Math.floor(t/52)+1}年${SEASON[Math.floor((t%52)/13)]}`;
function rulesAt(w){const o={...D.start};D.rules.forEach(r=>{if(r.week<=w)Object.assign(o,r.set)});return o}
function setFrame(i){if(!D)return;wk=clamp(Math.round(i),0,D.frames.length-1);const f=D.frames[wk];S.t=f[0];
  S.worlds.forEach((w,j)=>{const r=f[1][j];w.hhs={length:r[4]};w.working=r[5];w.event=r[6]||null});S.flow=f[2].map(([a,b,k,v])=>[a,b,k,v/G[k].v,v/G[k].v]);
  const p=[...D.probs].reverse().find(x=>x[0]<=wk);PROBS=p?p[1]:[];const rp=[...D.reps].reverse().find(x=>x[0]<=wk);reps=rp?rp[1]:[];S.worlds.forEach((w,j)=>w.rep={name:reps[j]?reps[j].name:'—'});
  lastTick=performance.now();ui();try{if(wk%10===0)localStorage.setItem('jg:wk',wk)}catch(e){}}
function ui(){const t=S.t;$('#date').textContent=`${when(t)}`;$('#dateSub').textContent=`第 ${wk+1} / ${D.frames.length} 周`;$('#pos').value=wk;
  $('#reps').innerHTML=reps.map((r,j)=>`<div class="rep ${RIDS[j]}"><span class="no">${r.no}</span><span class="rn">${r.name}</span><span class="rw">${r.w}代表${r.votes!=null?` · ${r.votes} 票`:''}</span><span class="rbio">${r.traits}</span></div>`).join('');
  const o=rulesAt(wk),L=D.labels,on=Object.entries(o).filter(([k,v])=>v===true&&L[k]).map(([k])=>L[k]);
  $('#now').innerHTML=[`<span class="chip" aria-pressed="true">${L[o.mode||'free']||o.mode}</span>`,...on.map(x=>`<span class="chip" aria-pressed="true">${x}</span>`)].join('');
  $('#rl').innerHTML=D.rules.length?D.rules.map(r=>`<li data-w="${r.week}" style="cursor:pointer${r.week<=wk?'':';opacity:.5'}"><span class="rtag ${r.role}">${r.role==='kid'?'小朋友':'爸爸妈妈'}</span><span class="t">${when(D.t0+r.week)}</span><b>${r.title}</b>${r.explain?`<span class="ex">${r.explain}</span>`:''}</li>`).join(''):'<li>还没有改过规则。</li>';
  document.querySelectorAll('#rl li[data-w]').forEach(li=>li.onclick=()=>setFrame(+li.dataset.w));
  const bad=PROBS.filter(p=>p.cls==='bad').length,lv=!PROBS.length?['good','运转得很好']:bad>=2||PROBS[0].sev>0.85?['bad','遇到大麻烦了']:bad?['bad','有严重的问题']:['warn','有些小问题'];
  $('#verdict').className='verdict '+lv[0];$('#vFace').textContent=lv[1];const pop=D.frames[wk][1].reduce((a,r)=>a+r[0],0);
  $('#vText').textContent=(PROBS.length?`最要紧的是：${PROBS[0].q}。`:'三个地区都吃得饱、有药用、冬天不冷。')+` 现在一共 ${pop} 人。`;
  $('#probs').innerHTML=PROBS.length?PROBS.map(p=>`<div class="prob ${p.cls}"><span class="k">问题</span><span class="q">${p.q}</span><span class="k">瓶颈</span><span class="v">${p.b}</span><span class="k">后果</span><span class="v">${p.c}</span></div>`).join(''):'<div class="prob good"><span class="k">现在</span><span class="q">没有发现问题</span></div>'}
function load(d){const first=!D;D=d;G=d.goods;EVN=d.evn;$('#ttl').textContent=d.title;document.title=d.title;$('#pos').max=d.frames.length-1;
  if(first){let s=0;try{s=+localStorage.getItem('jg:wk')||0}catch(e){}setFrame(s<d.frames.length?s:0);if(!reduceMotion)setRun(true)}else setFrame(wk)}
function tick(){if(wk>=D.frames.length-1){setRun(false);return}setFrame(wk+1)}
function loop(){if(!running)return;tick();timer=setTimeout(loop,tickMs())}
function setRun(v){running=v;$('#play').textContent=v?'⏸ 暂停':'▶ 播放';clearTimeout(timer);if(v)timer=setTimeout(loop,100)}
$('#play').onclick=()=>{if(!running&&wk>=D.frames.length-1)setFrame(0);setRun(!running)};$('#home').onclick=()=>setFrame(0);
$('#speed').onclick=e=>{speed=speed===1?2:speed===2?4:speed===4?8:speed===8?16:1;e.target.textContent=`速度 ${speed}×`};
$('#pos').oninput=e=>setFrame(+e.target.value);
async function get(){const r=await fetch('result.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
async function poll(){try{const d=await get();if(!D){load(d);$('#note').textContent=''}else if(d.ver!==D.ver){load(d);$('#note').textContent='结果更新了'}}catch(e){if(!D)$('#note').textContent='还没有结果文件 result.json'}setTimeout(poll,10000)}
fit();requestAnimationFrame(frame);let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{fit();if(D)ui()},120)});
poll();
})();

</script>
