<title>我的三地世界</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: a field-station logbook. Live map on the left, the rulebook on the right, the ledger of results underneath. */
:root{
  --bg:#eef1ec; --panel:#fbfcf9; --ink:#1d2621; --muted:#5d6a62; --line:#d3dbd2; --soft:#f1f4ee;
  --accent:#2f5d50; --kid:#c96a1b; --parent:#2a6f8f;
  --good:#2e8a4e; --warn:#b98112; --bad:#c2412f; --hubc:#3f4fa8;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --panel:#19211d; --ink:#e3ebe5; --muted:#97a69d; --line:#2c3832; --soft:#1f2924;
  --accent:#8cc7b2; --kid:#f0a35e; --parent:#6cbcdf; --good:#5cc985; --warn:#e3b54a; --bad:#f07563; --hubc:#9aa7ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --panel:#19211d; --ink:#e3ebe5; --muted:#97a69d; --line:#2c3832; --soft:#1f2924;
  --accent:#8cc7b2; --kid:#f0a35e; --parent:#6cbcdf; --good:#5cc985; --warn:#e3b54a; --bad:#f07563; --hubc:#9aa7ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4.6vw,42px);line-height:1.1;margin:0;letter-spacing:2px}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;letter-spacing:.5px}
h3{font-size:12.5px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.06em}
.date{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-variant-numeric:tabular-nums}
.date b{font-family:var(--f-display);font-size:24px;color:var(--accent);font-weight:600}
.date span{font-size:12.5px;color:var(--muted)}
.top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:940px){.top{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
#map{width:100%;aspect-ratio:5/6;max-width:100%;display:block;border-radius:14px;background:#3c4a3a;cursor:pointer;touch-action:manipulation}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px;text-align:left;line-height:1.3}
.seg button b{display:block;font-size:14.5px}
.seg button span{font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center;text-align:left}
.chip::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;opacity:.55}
.chip[aria-pressed="true"]::before{background:currentColor;opacity:1}
.kid .chip[aria-pressed="true"]{border-color:var(--kid);color:var(--kid);background:color-mix(in srgb,var(--kid) 9%,var(--panel))}
.parent .chip[aria-pressed="true"]{border-color:var(--parent);color:var(--parent);background:color-mix(in srgb,var(--parent) 9%,var(--panel))}
.grp{display:flex;flex-direction:column;gap:7px}
.who{display:inline-block;padding:1px 8px;border-radius:6px;color:var(--panel);margin-right:6px;letter-spacing:0}
.kid .who{background:var(--kid)} .parent .who{background:var(--parent)}
.slider{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3.6em;gap:10px;align-items:center;font-size:13px}
.slider input{width:100%;accent-color:var(--accent)}
.slider output{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
textarea{width:100%;min-height:58px;resize:vertical;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--soft);color:var(--ink)}
.who-toggle{display:flex;gap:6px}
.who-toggle button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:3px 10px;font-size:13px}
.who-toggle button[data-r="kid"][aria-pressed="true"]{border-color:var(--kid);color:var(--kid)}
.who-toggle button[data-r="parent"][aria-pressed="true"]{border-color:var(--parent);color:var(--parent)}
.note{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 10px;border-bottom:2.5px solid transparent;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:3px 16px;font-variant-numeric:tabular-nums;font-size:13.5px}
.kv span b{font-weight:700}
.flow{font-size:13px;display:flex;flex-direction:column;gap:3px}
.flow span{color:var(--muted)}
.table-wrap{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.8px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel)}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--soft)}
.pill{display:inline-block;min-width:40px;padding:0 6px;border-radius:6px;text-align:center}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent)}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.pill.bad{background:color-mix(in srgb,var(--bad) 22%,transparent)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:5px;color:var(--panel);margin-left:3px}
.tag.bad{background:var(--bad)} .tag.warn{background:var(--warn)} .tag.info{background:var(--muted)} .tag.good{background:var(--good)}
.person h4{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600}
.person ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.verdict{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;border-radius:14px;padding:12px 18px;border:2px solid var(--line);background:var(--panel)}
.verdict .face{font-family:var(--f-display);font-size:25px;font-weight:900}
.verdict.good{border-color:var(--good)} .verdict.good .face{color:var(--good)}
.verdict.warn{border-color:var(--warn)} .verdict.warn .face{color:var(--warn)}
.verdict.bad{border-color:var(--bad)} .verdict.bad .face{color:var(--bad)}
.verdict p{margin:0;flex:1 1 320px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.stat .d{font-size:12px;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:940px){.charts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.chart canvas{width:100%;height:150px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.lower{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,0.9fr);gap:14px;align-items:start}
@media (max-width:1050px){.lower{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:700px){.lower{grid-template-columns:minmax(0,1fr)}}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto}
.finds li{padding:8px 11px;border-radius:9px;background:var(--soft);border-left:4px solid var(--line);font-size:13.5px}
.finds li.good{border-left-color:var(--good)} .finds li.warn{border-left-color:var(--warn)} .finds li.bad{border-left-color:var(--bad)}
.news li,.log li{font-size:13px;padding:6px 9px;border-radius:8px;background:var(--soft)}
.news li .t,.log li .t{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;margin-right:6px}
.news li.bad{box-shadow:inset 3px 0 0 var(--bad)} .news li.good{box-shadow:inset 3px 0 0 var(--good)} .news li.info{box-shadow:inset 3px 0 0 var(--muted)}
.rtag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:5px;color:var(--panel);margin-right:5px}
.rtag.kid{background:var(--kid)} .rtag.parent{background:var(--parent)} .rtag.sys{background:var(--muted)}
.log .ex{display:block;color:var(--muted);margin-top:2px}
.ai{white-space:pre-wrap;font-size:13.5px;background:var(--soft);border-radius:9px;padding:9px 11px}
.diag{display:flex;flex-direction:column;gap:12px}
.probs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.prob{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:6px 10px;align-items:baseline}
.prob.bad{border-left-color:var(--bad)} .prob.good{border-left-color:var(--good)}
.prob .k{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.prob .q{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.35}
.prob .v{font-size:14px}
.prob .trend{grid-column:2;font-size:12px;color:var(--muted)}
.logbox summary{cursor:pointer;font-weight:600}
.close{margin-left:auto;border:0;background:none;color:var(--muted);padding:6px 4px;order:9}
.tabs{align-items:center}
.reps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.reps{grid-template-columns:minmax(0,1fr)}.rep{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:0 10px;align-items:center;padding:6px 10px}.rep .no{grid-row:1/4}}
.rep{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;background:var(--soft);text-align:left}
.rep:hover{border-color:var(--accent)}
.rep .no{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:2px solid currentColor;font-family:var(--f-display);font-weight:900;font-size:14px}
.rep .rn{font-family:var(--f-display);font-weight:600;font-size:16px}
.rep .rw{font-size:12px;color:var(--muted)}
.rep .rbio{font-size:12.5px}
.rep.mountain{color:#6b7280}.rep.village{color:#4c8a3c}.rep.coast{color:#2a79a8}
.rep>*:not(.no){color:var(--ink)}.rep .rw{color:var(--muted)}
.vbar{display:grid;grid-template-columns:2.2em 4.6em minmax(0,1fr) 2.6em;gap:6px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.vbar i{display:block;height:10px;border-radius:5px;background:var(--line)}
.vbar.won i{background:var(--accent)}
.vbar.won b{border:2px solid var(--accent);border-radius:50%;padding:0 5px}
.vbars{display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>我的三地世界</h1>
      <p class="sub">山区有矿，乡村有稻田，海边有鱼和贝壳。三个地区各选出一位代表来管事，三百多个有名字的人在这里一年四季地生活、生病、出生、老去。三位代表能不能让大家都吃饱、有药用？</p>
    </div>
    <div class="date"><b id="date">第 1 年 · 春</b><span id="dateSub">第 1 周</span></div>
  </header>

  <section class="top">
    <div class="col">
      <canvas id="map" aria-label="三个地区的地图：上面是山区，中间是乡村，下面是海边。小人是正在干活或运货的人，点击地区查看详情"></canvas>
      <div class="bar">
        <button class="btn primary" id="play">▶ 开始</button>
        <button class="btn" id="stepBtn">下一周</button>
        <button class="btn" id="speed">速度 1×</button>
        <button class="btn" id="reset">从头再来</button>
        <span class="note" id="tickNote"></span>
      </div>
      <div class="panel" id="detailPanel" hidden>
        <div class="tabs" role="tablist"><button class="close" id="closeDetail" aria-label="关上">关上</button>
          <button role="tab" id="tabWorld" aria-selected="true">这个地区</button>
          <button role="tab" id="tabRep" aria-selected="false">代表</button>
          <button role="tab" id="tabPeople" aria-selected="false">住在这里的人</button>
          <button role="tab" id="tabPerson" aria-selected="false" hidden>人物</button>
        </div>
        <div id="detail"></div>
      </div>
    </div>

    <div class="col">
      <div class="panel" id="elecPanel">
        <h2>三位代表</h2>
        <div class="reps" id="reps"></div>
        <div class="bar"><button class="btn" id="votesBtn">看全部候选人的票</button><button class="btn" id="reelect">现在重新选一次</button><span class="note" id="elecNote"></span></div>
        <div id="votes" hidden></div>
      </div>
      <div class="panel">
        <h2>三个地区怎么交换东西？</h2>
        <div class="seg" id="modes">
          <button data-mode="free"><b>不要钱 · 各取所需</b><span>东西交给代表，代表送给缺的人和别的地区</span></button>
          <button data-mode="barter"><b>以物易物</b><span>人和人、代表和代表，拿东西换东西</span></button>
          <button data-mode="money"><b>用贝壳当钱</b><span>海边的贝壳当钱，大家用贝壳买卖</span></button>
        </div>
        <div class="slider"><label for="kind">大家有多自觉</label><input type="range" id="kind" min="0" max="100" step="5"><output id="kindOut"></output></div>
        <div class="slider"><label for="shell">海边拾贝的人</label><input type="range" id="shell" min="0" max="60" step="1"><output id="shellOut"></output></div>
        <p class="note" id="shellNote">拾贝的人越多，贝壳越多。贝壳当钱时，钱多了东西就会变贵；不当钱时，贝壳是乡村稻田的肥料。</p>
      </div>
      <div class="panel">
        <div class="grp kid"><h3><span class="who">小朋友</span>的假设</h3><div class="chips" id="kidChips"></div></div>
        <div class="grp parent"><h3><span class="who">爸爸妈妈</span>的现实制约</h3><div class="chips" id="parentChips"></div></div>
        <p class="note">四季、生老病死、东西会坏、鱼和猎物会被打光，这些一直都在，不用开关。</p>
      </div>
      <div class="panel">
        <h2>说出你的想法</h2>
        <div class="who-toggle" role="group" aria-label="谁在提想法">
          <button data-r="kid" aria-pressed="true">我是小朋友</button>
          <button data-r="parent" aria-pressed="false">我是爸爸妈妈</button>
        </div>
        <textarea id="ideaText" placeholder="比如：如果三位代表都很清廉呢？&#10;或者：现实里乡村的代表会把粮食留给自己，还会闹瘟疫。"></textarea>
        <div class="bar"><button class="btn primary" id="ideaGo">放进世界里试试</button><span class="note" id="ideaNote"></span></div>
      </div>
    </div>
  </section>

  <section class="diag">
    <div class="verdict" id="verdict"><div class="face" id="vFace">—</div><p id="vText"></p></div>
    <div class="probs" id="probs"></div>
    <div class="bar" id="aiBar" hidden><button class="btn" id="aiBtn">请 Claude 讲讲为什么</button></div>
    <div class="ai" id="aiOut" hidden></div>
    <details class="panel logbox"><summary>实验记录（改过哪些规则）</summary><ul class="list log" id="log"></ul></details>
  </section>
</div>

<script>
/*SIM-START: three regions (mountain 6, village 7, coast 9), each governed by an elected representative*/
var Sim=(()=>{
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
function mkRng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- goods: unit, calories, weekly spoilage, base value (1 value = 1 shell when shells are money) ----------
const G={
 rice:{n:'稻米',u:'公斤',kcal:3500,rot:0.004,v:9,food:1},
 veg:{n:'蔬菜',u:'公斤',kcal:250,rot:0.2,v:2.5,food:1},
 tuber:{n:'山薯和栗子',u:'公斤',kcal:1000,rot:0.02,v:4.5,food:1},
 egg:{n:'鸡蛋',u:'公斤',kcal:1400,rot:0.06,v:12,food:1,prot:1},
 fish:{n:'鲜鱼',u:'公斤',kcal:1000,rot:0.5,v:6,food:1,prot:1},
 dfish:{n:'咸鱼干',u:'公斤',kcal:1400,rot:0.01,v:11,food:1,prot:1},
 meat:{n:'鲜肉',u:'公斤',kcal:2000,rot:0.45,v:18,food:1,prot:1},
 smeat:{n:'腊肉',u:'公斤',kcal:2600,rot:0.01,v:26,food:1,prot:1},
 salt:{n:'盐',u:'公斤',rot:0,v:8},
 wood:{n:'木柴',u:'公斤',rot:0,v:0.7},
 ore:{n:'铁矿石',u:'公斤',rot:0,v:40},
 cloth:{n:'布',u:'米',rot:0.002,v:100},
 pot:{n:'陶器',u:'件',rot:0.01,v:40},
 med:{n:'药品',u:'剂',rot:0.01,v:120},
 tool:{n:'铁器工具',u:'件',rot:0,v:480},
 shell:{n:'贝壳',u:'枚',rot:0,v:1},
};
const GK=Object.keys(G),FOOD=GK.filter(g=>G[g].food);
const BY_STORE=[...FOOD].sort((a,b)=>G[a].rot-G[b].rot);
const BY_FRESH=[...FOOD].sort((a,b)=>G[b].rot-G[a].rot);
const INT={tool:1,pot:1};
const SEASON=['春','夏','秋','冬'];
const season=t=>Math.floor((t%52)/13);
const when=t=>`第${Math.floor(t/52)+1}年${SEASON[season(t)]}`;

// ---------- jobs: weekly output of a healthy adult with good tools, by season (spring, summer, autumn, winter) ----------
const JOB={
 farmer:{n:'种稻农民',heavy:1},
 gardener:{n:'菜农',out:{veg:[30,60,40,15],egg:[2,3,2,1]}},
 weaver:{n:'织布工'},potter:{n:'陶匠'},
 hillfarmer:{n:'山地农民',out:{tuber:[22,50,120,55]},heavy:1},

function nameOf(sur,sex){return sur+(R()<0.5?MID[R()*MID.length|0]:'')+(sex==='m'?MN:FN)[R()*20|0]}
function mkPerson(hh,age,sex){const p={id:S.nid++,name:nameOf(hh.sur,sex),sex,age,hh,job:null,skill:0.75+R()*0.5,dil:0.3+R()*0.7,greed:R(),kind:R(),
  health:0.85+R()*0.15,sick:null,kcov:1,warm:1,variety:2,prot:0.2,comfort:0.5,saltOk:1,effort:0,hours:0,clothes:age<1?0.9:0.55+R()*0.4,happy:0.7,grief:0,log:[],alive:true,vote:0,cand:0};
  hh.members.push(p);S.people.push(p);assignJob(p);return p}
function assignJob(p){const w=p.hh.world;if(p.age<16||p.age>=72){p.job=null;return}
  if(p.cand&&candOf(w)&&candOf(w).no===p.cand&&w.repNo===p.cand){p.job='rep';return}

function mkHH(w,sur){const h={id:S.nid++,world:w,sur:sur||SUR[R()*SUR.length|0],members:[],inv:{},money:0,crop:0,cropTotal:0,toolDur:0,distPen:0,hungry:0,staff:false};w.hhs.push(h);S.hhs.push(h);return h}
function genSpec(left){const r=R();let m=[];
  if(r<0.6&&left>=2){const a=24+R()*22;m.push({age:a,sex:'m'},{age:a-2+R()*4,sex:'f'});const k=1+(R()*4|0);for(let i=0;i<k;i++)m.push({age:Math.max(0,a-20-R()*16),sex:R()<.5?'m':'f'});if(R()<0.25)m.push({age:60+R()*14,sex:R()<.5?'m':'f'})}
  else if(r<0.75&&left>=2){const a=58+R()*16;m.push({age:a,sex:'m'},{age:a-3+R()*4,sex:'f'})}
  else m.push({age:20+R()*40,sex:R()<.5?'m':'f'});

  return m}
function populate(w){let a=0;

    if(w.id==='coast'){h.inv.dfish=n*5}
    if(w.id==='village'){h.inv.veg=n*1;h.inv.egg=n*1}});
}
function ensureStaff(){ // the smithy and the granary need people; when some die or move away, others take over
  S.worlds.forEach(w=>{const need=[['clerk',2]];if(w.id==='mountain')need.push(['smith',2]);
    need.forEach(([j,n])=>{const have=w.hhs.reduce((a,h)=>a+h.members.filter(p=>p.job===j&&p.age>=16&&p.age<72).length,0);

// ---------- targets: what a household wants to have at home ----------
function targets(h,greedy){
  const n=h.members.length,wk=S.t%52,se=season(S.t),gx=greedy?1+1.6*greedOf(h):1,gf=greedy?1+0.6*greedOf(h):1;

  let res=cover;if(h.world.id==='village'&&h.members.some(p=>p.job==='farmer')){const d=(26-wk+52)%52;res=Math.max(cover,Math.min(44,d+3))}
  const winterLeft=se===3?52-wk:(wk>=30?13:0),heat=S.harsh?18:12;
  const sickDoses=h.members.reduce((a,p)=>a+(p.sick?ILL[p.sick.type].dose:0),0),ws=workers(h).length;
  const t={foodK:hhKcal(h)*res*gf,wood:n*(3*cover+heat*Math.min(winterLeft,10))*gx,salt:n*0.08*10*gx,med:Math.ceil((1+n*0.25+sickDoses)*gx),
    tool:ws*1.0*gx,cloth:h.members.reduce((a,p)=>a+Math.max(0,0.85-p.clothes)*4,0)*gx+(wk>=30&&wk<39?n*0.3:0),pot:Math.ceil(n*0.6*gx)};
  if(h.world.id==='coast')t.salt+=n*1.5;
  const pt=h.members.filter(p=>p.job==='potter').length;if(pt)t.wood+=pt*20*4;
  const fm=h.members.filter(p=>p.job==='farmer').length;if(fm&&P.mode!=='money'&&wk<14)t.shell=fm*200;
  return t}
function needs(h,t){const inv=h.inv,o={};
  o.food=Math.max(0,t.foodK-kcalOf(inv));

  if(h.toolDur<t.tool*0.7)o.tool=Math.max(1,Math.round(t.tool-h.toolDur));
  return o}
function surplus(h,t){const inv=h.inv,o={};
  let keep=t.foodK;for(const g of BY_STORE){const have=inv[g]||0;if(!have)continue;const k=Math.min(have,keep/G[g].kcal);keep-=k*G[g].kcal;if(have-k>0.05)o[g]=have-k}
  for(const g of GK){if(G[g].food||g==='tool')continue;const have=inv[g]||0,tg=t[g]||0;if(have-tg>0.05)o[g]=have-tg}
  return o}
const foodPref=h=>{const mine=new Set(Object.keys(JOB).filter(j=>h.members.some(p=>p.job===j)).flatMap(j=>JOB[j].out?Object.keys(JOB[j].out):[]));return[...BY_FRESH].sort((a,b)=>(mine.has(a)?1:0)-(mine.has(b)?1:0))};
const urgScore=h=>h.members.reduce((a,p)=>a+(p.sick?2:0)+(p.kcov<0.8?2:0),0);

// ---------- events ----------
function events(se){
  S.harsh=false;
  S.worlds.forEach(w=>{if(w.evLeft>0){w.evLeft--;if(!w.evLeft)w.event=null}});
  if(S.winterEv>0){S.winterEv--;S.harsh=true}
  if(!P.disasters)return;
  S.worlds.forEach(w=>{if(w.event)return;
    for(const e of w.ev){const ok=(e==='drought'||e==='locust')?se===1:e==='fire'?se!==3:e==='bumper'?se===2:true;
      const p={drought:0.014,locust:0.007,fire:0.005,storm:0.008,collapse:0.005,bumper:0.005}[e];if(ok&&R()<p){trigger(w,e);break}}
    if(!w.event&&R()<0.0022)trigger(w,'plague')});
  if(se===3&&S.t%52===39&&R()<0.25){S.winterEv=13;S.harsh=true;news('bad','今年冬天特别冷，每家都要烧更多的柴。')}
}
function trigger(w,e,quiet){w.event=e;w.evLeft={drought:8,locust:1,fire:3,storm:2,collapse:3,plague:10,bumper:8,winter:13}[e]||3;
  if(e==='fire'){S.res.forest*=0.85;S.res.game*=0.85}
  if(e==='locust')w.hhs.forEach(h=>h.crop*=0.6);
  if(e==='collapse'){const ms=w.hhs.flatMap(h=>h.members.filter(p=>p.job==='miner'&&!p.sick));for(let i=0;i<Math.min(3,ms.length);i++){const p=ms[R()*ms.length|0];if(!p.sick){p.sick={type:'inj',wk:4};logP(p,'矿井塌方，受了伤')}}}
  if(e==='plague'){const ps=w.hhs.flatMap(h=>h.members);for(let i=0;i<3&&ps.length;i++){const p=ps[R()*ps.length|0];p.sick={type:'plague',wk:4};logP(p,'染上了瘟疫')}}
  if(e==='winter')S.winterEv=13;
  if(!quiet)news(e==='bumper'?'good':'bad',`${w.name}：${EVN[e]}！`,w)}
function evMult(w,job){if(!w.event)return 1;const e=w.event;
  if(e==='bumper')return 1.4;
  if(e==='drought')return job==='farmer'||job==='gardener'?0.45:job==='hillfarmer'?0.6:1;
  if(e==='storm')return job==='fisher'?0.1:job==='salter'||job==='shell'?0.25:0.85;
  if(e==='fire')return job==='woodcutter'?0.3:job==='hunter'?0.5:1;
  if(e==='collapse')return job==='miner'?0.25:1;if(e==='plague')return 0.8;return 1}

// ---------- one week ----------
function step(){
  S.t++;const t=S.t,se=season(t),wk=t%52;
  const pop=S.people.length;S.sizeErode=Math.min(1,Math.pow(380/Math.max(pop,1),0.5));
  if(wk===0)S.yr={births:0,deaths:0};
  events(se);
  const rs=S.res;rs.fish+=0.035*rs.fish*(1-rs.fish);rs.game+=0.025*rs.game*(1-rs.game);rs.forest+=0.004*rs.forest*(1-rs.forest)+0.0004;
  illness(se);
  work(se,wk);
  craftAndPreserve();
  S.worlds.forEach(w=>{w.inflow={};w.short={};w.skimmed=0;w.tradeIn={};w.tradeOut={};w.why={};w.queue=0});
  share();
  publicWork();
  S.flow=[];S.dem={};S.sup={};
  S.worlds.forEach(w=>deposit(w,plan(w)));
  trade();
  S.worlds.forEach(w=>distribute(w,plan(w)));
  priceUpdate();
  consume(se,wk);health();family();spoil();money(wk);relations();
  if(wk%4===0){flee();migrate();ensureStaff()}
  if(P.elections&&t>=S.nextElection)holdElection(false);
  record();
}

function illness(se){
  S.plagueW=new Set(S.worlds.filter(w=>w.hhs.some(h=>h.members.some(p=>p.sick&&p.sick.type==='plague'))).map(w=>w.id));
  S.worlds.forEach(w=>{const ps=w.hhs.flatMap(h=>h.members);const inf=ps.filter(p=>p.sick&&p.sick.type==='plague').length,frac=ps.length?inf/ps.length:0;
    ps.forEach(p=>{if(p.sick)return;let r=R();
      const cold=0.006+(se===3?0.012:0)+(p.clothes<0.4?0.008:0)+(S.harsh?0.008:0);
      const dys=0.0015+(se===1?0.003:0)+(p.kcov<0.7?0.004:0);
      const inj=p.job&&JOB[p.job].risk||0.0008;
      const pl=p.immune?0:frac*0.35;
      if(r<pl){p.sick={type:'plague',wk:4};logP(p,'被传染了瘟疫')}
      else if((r-=pl)<dys){p.sick={type:'dys',wk:3};logP(p,'得了痢疾')}
      else if((r-=dys)<inj){p.sick={type:'inj',wk:4};logP(p,'干活时受了伤')}
      else if((r-=inj)<cold){p.sick={type:'cold',wk:2}}})})}

function work(se,wk){
  S.worlds.forEach(w=>w.made={});
  const land={};S.worlds.forEach(w=>{if(!w.land)return;for(const j in w.land){const n=w.hhs.reduce((a,h)=>a+h.members.filter(p=>p.job===j&&!p.sick&&p.age>=16).length,0);land[w.id+j]=n>w.land[j]?Math.pow(w.land[j]/n,0.6):1}});
  const resF={fish:clamp(S.res.fish/0.7,0,1.25),game:clamp(S.res.game/0.7,0,1.25),forest:clamp(S.res.forest/0.7,0,1.2)};
  const take={fish:0,game:0,forest:0};S.forF={};S.forN=S.forN||{};S.worlds.forEach(w=>{const n=S.forN[w.id]||0;S.forF[w.id]=n>30?Math.pow(30/n,0.7):1});S.forN={};
  S.hhs.forEach(h=>{const w=h.world,ws=workers(h),toolF=0.55+0.45*clamp(h.toolDur/Math.max(1,ws.length*0.5),0,1);
    let farmLab=0;const forage=(h.foodWeeks!=null&&h.foodWeeks<1&&h.members.some(p=>p.kcov<0.9))?0.5:0;
    const rice=h.members.length;
    h.members.forEach(p=>{p.hours=0;p.effort=0;if(!p.job||p.job==='artist'||JOB[p.job].pub)return;
      let lab=p.age<16?0:p.age<18?0.7:p.age<65?1:p.age<72?0.5:0;if(p.sick)lab=0;lab*=clamp(0.3+0.7*p.health/0.8,0,1);if(lab<=0)return;
      let m=0.92+0.08*p.dil;
      if(P.freeRide){if(P.mode==='free')m=0.35+0.65*(0.5*p.dil+0.5*kEff(p));else m=0.85+0.15*p.dil;if(P.reputation&&P.mode==='free')m+=(1-m)*0.55}
      if(h.foodWeeks!=null&&h.foodWeeks<2)m=Math.max(m,0.88);
      if(S.famine>0.1)m+=(1-m)*Math.min(0.8,S.famine*2);
      if(P.mode==='money'&&S.inflM>0.04)m*=1-Math.min(0.3,S.inflM*1.5);
      if(P.freedom)m*=1.05;
      let eff=lab*m*p.skill*(1-h.distPen);p.effort=m;
      if(forage){S.forN[w.id]=(S.forN[w.id]||0)+1;add(h.inv,'tuber',22*lab*forage*(se===3?0.3:se===0?0.8:1.1)*(S.forF[w.id]||1)*1.6);eff*=1-forage;p.forage=true}else p.forage=false;
      p.hours=40*lab*m;
      const j=JOB[p.job],ev=evMult(w,p.job);
      if(p.job==='farmer'){farmLab+=eff;return}
      if(p.job==='potter'){const n=5*eff*toolF*ev,wd=Math.min(h.inv.wood||0,n*4),pq=n*(0.3+0.7*(n>0?wd/(n*4):0));add(h.inv,'pot',pq);add(w.made,'pot',pq);h.inv.wood=(h.inv.wood||0)-wd;h.toolDur=Math.max(0,h.toolDur-0.02*lab);return}
      if(p.job==='weaver'){const n=3*eff*toolF*ev;add(h.inv,'cloth',n);add(w.made,'cloth',n);h.toolDur=Math.max(0,h.toolDur-0.02*lab);return}
      if(!j.out)return;
      const lf=w.land&&w.land[p.job]?land[w.id+p.job]:1;
      for(const g in j.out){let q=j.out[g][se]*eff*toolF*ev*lf;if(j.res){q*=resF[j.res];take[j.res]+=q}
        if(g==='shell'&&P.mode==='money')h.money+=q;else add(h.inv,g,q);add(w.made,g,q)}
      h.toolDur=Math.max(0,h.toolDur-0.02*lab)});
    // gathering brush and driftwood for the fire
    if(w.id==='village')add(h.inv,'wood',h.members.length*3.5);if(w.id==='coast')add(h.inv,'wood',h.members.length*2.5);
    if(w.id==='village'){
      const lf=land['villagefarmer']||1,nf=h.members.filter(p=>p.job==='farmer').length;
      let lime=1;if(nf&&wk<14){if(P.mode==='money')lime=1;else{const need=nf*200/14;const have=h.inv.shell||0;lime=clamp(have/Math.max(1,need*14),0,1);h.inv.shell=Math.max(0,have-need)}}
      else lime=h.limeKeep||1;h.limeKeep=lime;
      if(wk<26){let g=farmLab*toolF*lf*(1+0.15*lime);if(w.event==='drought'){g*=0.4;h.crop*=0.985}if(w.event==='bumper')g*=1.3;h.crop+=g}
      else if(wk<39){if(wk===26){h.cropTotal=h.crop;h.crop=0}const want=h.cropTotal/13*55,can=clamp(farmLab/Math.max(0.5,workers(h).length*0.7),0,1);
        const got=want*can*(w.event==='bumper'?1.25:1);add(h.inv,'rice',got);add(w.made,'rice',got)}
    }
  });
  S.res.fish=Math.max(0.02,S.res.fish-take.fish/180000);S.res.game=Math.max(0.02,S.res.game-take.game/26000);S.res.forest=Math.max(0.05,S.res.forest-take.forest/4000000);
}

function craftAndPreserve(){
  S.hhs.forEach(h=>{const inv=h.inv,kw=hhKcal(h);
    for(const[f,s]of[['fish','dfish'],['meat','smeat']]){const keep=kw*0.3/G[f].kcal,ex=(inv[f]||0)-keep;if(ex>0){const q=Math.min(ex,(inv.salt||0)/0.15);if(q>0){inv[f]-=q;inv.salt-=q*0.15;add(inv,s,q*0.6)}}}})}

// the smithy (in the mountain) turns ore and wood into tools; the clerks decide how many families the granary can serve in a week
function publicWork(){
  const m=S.worlds[0],H=m.store;
  const smiths=m.hhs.flatMap(h=>h.members.filter(p=>p.job==='smith'&&!p.sick&&p.age>=16&&p.age<72));
  const cnt=smiths.reduce((a,p)=>a+clamp(p.health/0.8,0.3,1)*(0.6+0.4*clamp(p.skill,0.6,1.3)),0);
  const tq=Math.max(0,Math.min(cnt*2.5,(H.ore||0)/10,(H.wood||0)/15,40-(H.tool||0)));H.ore=(H.ore||0)-tq*10;H.wood=(H.wood||0)-tq*15;add(H,'tool',tq);add(m.made,'tool',tq);
  S.worlds.forEach(w=>{const cl=w.hhs.flatMap(h=>h.members.filter(p=>p.job==='clerk'&&!p.sick&&p.age>=16&&p.age<72)).reduce((a,p)=>a+clamp(p.health/0.8,0.3,1),0);
    w.cap=Math.max(6,cl*14*(0.7+0.6*trait(w,'dil')));w.cl=cl;
    w.hhs.forEach(h=>{h.staff=h.members.some(p=>p.job&&JOB[p.job].pub&&p.age>=16)})})}

function share(){ // neighbours inside one region help families that have nothing
  const rate=P.share?0.6:0.25,wkf=h=>kcalOf(h.inv)/Math.max(1,hhKcal(h));
  S.worlds.forEach(w=>{const hs=w.hhs.filter(h=>h.members.length),donors=hs.filter(h=>wkf(h)>8),needy=hs.filter(h=>wkf(h)<1);
    needy.forEach(r=>{const want=hhKcal(r)*1.5-kcalOf(r.inv);for(const d of donors){if(want<=0)break;const ex=(wkf(d)-8)*hhKcal(d)*rate*kindOf(d);if(ex>0)takeFood(d.inv,Math.min(ex,want),BY_FRESH,r.inv)}});
    if(P.mode==='money'){const cost=h=>hhKcal(h)/15400*45*S.moneyFactor,poor=hs.filter(h=>kcalOf(h.inv)<hhKcal(h)*1.5&&h.money<cost(h)*2),rich=hs.filter(h=>h.money>cost(h)*10);
      poor.forEach(r=>{for(const d of rich){const g=Math.min((d.money-cost(d)*10)*rate*kindOf(d),cost(r)*3-r.money);if(g>0){d.money-=g;r.money+=g;break}}})}})}

// ---------- the commons of each region: deposit, trade between regions, distribute ----------
function plan(w){const hs=w.hhs.filter(h=>h.members.length).map(h=>{const tg=targets(h,true),tn=targets(h,false);return{h,need:needs(h,tg),real:needs(h,tn),sur:surplus(h,tg)}});
  for(let i=hs.length-1;i>0;i--){const j=R()*(i+1)|0;[hs[i],hs[j]]=[hs[j],hs[i]]}
  return hs.sort((a,b)=>(b.h.staff?1:0)-(a.h.staff?1:0))}
const pace=(w,x)=>{if(x.h.staff)return true;const k=x.h.id;if(w.seen.has(k))return !w.blocked.has(k);w.seen.add(k);w.served++;if(w.served>w.cap){w.queue++;w.blocked.add(k);return false}return true};
// what passes through the hands of the representative: a dishonest one keeps a share
function commonsIn(w,g,q){let s=0;if(P.corruption){s=Math.pow(1-trait(w,'hon'),1.3)*0.15*(1+0.5*(P.greed?1:0));
    const rp=repPerson(w);if(s>0&&rp){const k=q*s;add(rp.hh.inv,g,k);w.skimmed+=k*(G[g].v);w.skimTot=(w.skimTot||0)+k*G[g].v;S.cnt.leak+=k*G[g].v;q-=k}}
  add(w.inflow,g,q);return q}
function deposit(w,pl){if(P.mode==='free')depositFree(w,pl);else if(P.mode==='money')sellMoney(w,pl);else depositTax(w,pl)}
// with swapping, the commons still lives on a tribute in kind: a share of each family's surplus, set by the representative
function depositTax(w,pl){const H=w.store,tax=(0.18+0.2*(1-trait(w,'gen')))*(0.5+0.5*w.trust);
  pl.forEach(x=>{for(const g in x.sur){if(g==='shell'&&false)continue;const q=x.sur[g]*tax;if(q<=0)continue;x.h.inv[g]-=q;add(H,g,commonsIn(w,g,q))}})}
function distribute(w,pl){w.seen=new Set();w.served=0;w.blocked=new Set();
  if(P.mode==='free'){staffSupply(w);distFree(w,pl)}else if(P.mode==='barter'){staffSupply(w);barterLocal(w,pl)}else buyMoney(w,pl)}
function staffSupply(w){const H=w.store;w.hhs.forEach(h=>{if(!h.staff)return;const t=targets(h,false),nd=needs(h,t);
  if(nd.food)takeFood(H,nd.food,foodPref(h),h.inv);
  for(const g of ['wood','salt','cloth','pot','med']){if(nd[g]){const q=Math.min(H[g]||0,nd[g]);H[g]=(H[g]||0)-q;add(h.inv,g,q)}}})}

function depositFree(w,pl){const H=w.store,tr=0.5+0.5*w.trust;
  pl.forEach(x=>{const kd=kindOf(x.h),gr=greedOf(x.h);
    for(const g in x.sur){let f=P.greed?clamp(0.2+0.8*kd-0.3*gr,0.05,1):0.95;if(G[g].food)f+=(1-f)*Math.min(1,(S.famine||0)*3)*kd;f*=tr;
      const q=x.sur[g]*f;if(q<=0)continue;x.h.inv[g]-=q;add(H,g,commonsIn(w,g,q))}})}
function distFree(w,pl){const H=w.store;let list=pl;if(P.needFirst)list=[...pl].sort((a,b)=>(b.h.staff?1:0)-(a.h.staff?1:0)||urgScore(b.h)-urgScore(a.h));
  list.forEach(x=>{const want=P.needFirst?x.real:x.need;
    if(want.food>0){if(!pace(w,x)){add(w.short,'food',want.food);return}const got=takeFood(H,want.food,foodPref(x.h),x.h.inv);add(w.short,'food',want.food-got)}
    for(const g of ['med','tool','wood','salt','cloth','pot','shell']){const q=want[g];if(!q)continue;if(!pace(w,x)){add(w.short,g,q);continue}
      let got=Math.min(H[g]||0,q);if(INT[g])got=Math.floor(got);if(got<=0){add(w.short,g,q);continue}
      H[g]-=got;if(g==='tool')x.h.toolDur+=got;else add(x.h.inv,g,got);add(w.short,g,q-got)}})}

function barterLocal(w,pl){const H=w.store,val=g=>G[g].v*S.sc[g];
  const parts=pl.map(x=>({x,h:x.h,haves:{...x.sur},wants:{...x.need},foodK:x.need.food||0}));parts.forEach(p=>delete p.wants.food);
  const give=(from,to,g,q)=>{from.h.inv[g]-=q;if(g==='tool')to.h.toolDur+=q;else add(to.h.inv,g,q);from.haves[g]-=q};
  const wantsOf=(b,g)=>G[g].food?(b.foodK>0?b.foodK/G[g].kcal:0):(b.wants[g]||0);
  const reduceWant=(b,g,q)=>{if(G[g].food)b.foodK-=q*G[g].kcal;else b.wants[g]-=q};
  const peer=(a,g,qWant)=>{let got=0;
    for(const b of parts){if(b===a||got>=qWant-1e-6)continue;const bh=b.haves[g]||0;if(bh<=1e-6)continue;
      for(const h2 in a.haves){if(got>=qWant-1e-6)break;const ah=a.haves[h2]||0;if(ah<=1e-6||h2===g)continue;const bw=wantsOf(b,h2);if(bw<=1e-6)continue;
        let q=Math.min(qWant-got,bh,ah*val(h2)/val(g),bw*val(h2)/val(g));if(INT[g]){q=Math.floor(q+1e-9);if(q<1)continue}if(q<=1e-6)continue;
        const back=q*val(g)/val(h2);give(b,a,g,q);give(a,b,h2,back);reduceWant(b,h2,back);got+=q}}
    return got};
  const post=(a,g,qWant)=>{let got=0;const avail=Math.max(0,(H[g]||0)-(g==='med'?4:0));if(avail<=1e-6)return 0;
    for(const h2 in a.haves){if(got>=qWant-1e-6)break;const ah=a.haves[h2]||0;if(ah<=1e-6||h2===g)continue;const room=capOf(w,h2)*2-(H[h2]||0);if(room<=0)continue;
      let q=Math.min(qWant-got,avail-got,ah*val(h2)/val(g),room*val(h2)/val(g));if(INT[g]){q=Math.floor(q+1e-9);if(q<1)continue}if(q<=1e-6)continue;
      const back=q*val(g)/val(h2);H[g]-=q;if(g==='tool')a.h.toolDur+=q;else add(a.h.inv,g,q);a.h.inv[h2]-=back;a.haves[h2]-=back;add(H,h2,commonsIn(w,h2,back));got+=q}
    return got};
  const tryGet=(a,g,q)=>{let got=peer(a,g,q);if(got<q-1e-6)got+=post(a,g,q-got);return got};
  parts.forEach(a=>{
    if(a.h.staff)return;
    const ask=Object.entries(a.wants).filter(([,q])=>q>0);if(a.foodK>0)ask.unshift(['food',a.foodK]);
    ask.forEach(([g,q])=>{if(!pace(w,a.x)){add(w.short,g,q);return}
      let got=0;
      if(g==='food'){for(const f of BY_STORE){if(got>=q)break;const k=tryGet(a,f,(q-got)/G[f].kcal);got+=k*G[f].kcal}}else got=tryGet(a,g,q);
      if(got<q*0.5){S.barterFail=(S.barterFail||0)+1}S.barterTry=(S.barterTry||0)+1;add(w.short,g,q-got)})});
  GK.forEach(g=>{const u=w.short[g]||0;S.sc[g]=clamp(S.sc[g]*(u>(H[g]||0)?1.012:0.996),0.5,3)})}

// shells as money
function sellMoney(w,pl){const p=S.prices,H=w.store;
  const limit=150000*S.moneyFactor;w.limit=limit;
  w.hhs.forEach(h=>{const n=h.members.filter(p2=>p2.job&&JOB[p2.job].pub&&p2.age>=16).length;if(!n)return;const wg=n*150*S.moneyFactor;h.money+=wg;w.cash-=wg});
  const bidF=clamp(0.7+0.3*(w.cash+limit)/(limit+25000*S.moneyFactor),0.6,0.97);
  pl.forEach(x=>{const gr=greedOf(x.h),hold=P.greed&&S.inflM>0.03?0.5*gr:0;
    for(const g in x.sur){if(g==='shell')continue;const room=capOf(w,g)-(H[g]||0);if(room<=0)continue;const bid=p[g]*bidF;
      const q=Math.min(room,x.sur[g]*S.trust*(1-hold),Math.max(0,w.cash+limit)/bid);if(q<=1e-6)continue;
      x.h.inv[g]-=q;add(H,g,commonsIn(w,g,q));x.h.money+=q*bid;w.cash-=q*bid}})}
function buyMoney(w,pl){const p=S.prices,H=w.store;
  const credit=x=>hhKcal(x.h)/15400*45*S.moneyFactor*8;
  const pay=(x,g,q,pr)=>{H[g]-=q;if(g==='tool')x.h.toolDur+=q;else add(x.h.inv,g,q);x.h.money-=q*pr;w.cash+=q*pr};
  const buy=(x,g,q)=>{const pr=p[g];let can=Math.min(q,Math.max(0,x.h.money+(g==='med'||g==='wood'?credit(x):0))/pr);if(INT[g])can=Math.floor(can);add(S.dem,g,can);
    const got=Math.min(can,H[g]||0);if(can-got>0.01)add(S.shortAll,g,can-got);if(got<=0){add(w.short,g,q);return}pay(x,g,got,pr);add(w.short,g,q-got)};
  pl.forEach(x=>{
    for(const g of ['med','food','wood','salt','tool','cloth','pot']){const q=x.need[g];if(!q)continue;if(!pace(w,x)){add(w.short,g,q);continue}
      if(g==='food'){let left=q;const fl=foodPref(x.h).sort((a,b)=>p[a]/G[a].kcal-p[b]/G[b].kcal);
        for(const f of fl){if(left<=0)break;const pr=p[f],k=Math.min(left/G[f].kcal,Math.max(0,x.h.money+credit(x))/pr);if(k<=0)break;const got=Math.min(k,H[f]||0);add(S.dem,f,got);
          if(got<=0){add(S.shortAll,f,k);continue}pay(x,f,got,pr);left-=got*G[f].kcal}
        add(w.short,'food',left);continue}
      buy(x,g,q)}
    const reserve=hhKcal(x.h)/15400*45*S.moneyFactor*16,spare=x.h.money-reserve;
    if(spare>0){const gr=greedOf(x.h),budget=spare*(P.greed?0.3+0.5*gr:0.25);const lux=['egg','smeat','pot','cloth','dfish','rice','salt'].filter(g=>(H[g]||0)>0.5);
      lux.forEach(g=>{const pr=p[g],q=budget/lux.length/pr;add(S.dem,g,q);const got=Math.min(q,H[g]||0);if(q-got>0.01)add(S.shortAll,g,q-got);if(got>0)pay(x,g,got,pr)})}});
  const m=S.worlds.indexOf(w);void m;
  if(S.t%4===0){const tgt=25000*S.moneyFactor;if(w.cash>tgt){const d=(w.cash-tgt)*0.6,n=Math.max(1,S.people.filter(q=>q.hh.world===w).length);w.cash-=d;w.hhs.forEach(h=>h.money+=d*h.members.length/n)}}}
function priceUpdate(){if(P.mode!=='money')return;const p=S.prices;
  const sup={};S.worlds.forEach(w=>{for(const g of GK)add(sup,g,(w.store[g]||0)/4+(w.inflow[g]||0))});
  GK.forEach(g=>{S.demand[g]=(S.demand[g]||0)*0.9+0.1*(S.dem[g]||0);S.supply[g]=(S.supply[g]||sup[g]||1)*0.85+0.15*(sup[g]||0)});
  const mf=S.moneyFactor;
  GK.forEach(g=>{if(g==='shell')return;const d=Math.max(0.1,S.demand[g]+(S.shortAll&&S.shortAll[g]||0)),sp=Math.max(0.1,S.supply[g]),sc=clamp(Math.pow(d/sp,0.35),0.6,2.2);
    const tgt=G[g].v*mf*sc;p[g]+=(tgt-p[g])*0.2;if(P.priceCap)p[g]=Math.min(p[g],G[g].v)});
  S.shortAll={}}

// ---------- trade between the three regions: done by the representatives ----------
function balance(w){const H=w.store,hs=w.hhs.filter(h=>h.members.length),N={};let Fk=0,pk=0;
  hs.forEach(h=>{const nd=needs(h,targets(h,false));Fk+=nd.food||0;pk+=hhKcal(h);for(const g in nd)if(g!=='food')N[g]=(N[g]||0)+nd[g]});
  GK.forEach(g=>{if(!G[g].food)w.dem[g]=(w.dem[g]||0)*0.85+(N[g]||0)*0.15});
  // households keep their own food for the year; the commons keeps a small reserve, and a region that depends on imports also stocks up at harvest for the months ahead
  const wk=S.t%52,f=trait(w,'fore'),dep={mountain:0.5,village:0,coast:0.45}[w.id],toH=Math.min(46,(26-wk+52)%52);
  let weeks=2+4*f+dep*toH*(0.4+0.6*f);if(P.rivalry)weeks*=1.35;
  const resK=pk*weeks,info={food:Math.max(0,Fk+resK*0.6-kcalOf(H)),imp:{},off:{},Fk,resK};w.reserveK=resK;
  const WK={wood:3,salt:8,med:4,tool:5,cloth:6,pot:6,shell:2};
  for(const g in WK){if(g==='shell'&&P.mode==='money')continue;const d=(w.dem[g]||0)*WK[g],need=N[g]||0,have=H[g]||0;
    info.imp[g]=Math.max(0,need+d-have);let keepExtra=0;if(w.id==='mountain'&&g==='wood')keepExtra=500;
    info.off[g]=Math.max(0,have-need-d*(P.rivalry?2:1.4)-keepExtra)}
  let offK=Math.max(0,kcalOf(H)-Fk-resK*(P.rivalry?1.2:1));
  for(const f2 of BY_FRESH){const q=Math.min(H[f2]||0,offK/G[f2].kcal);if(q>0.01){info.off[f2]=q;offK-=q*G[f2].kcal}}
  return info}
const needOf=(info,g)=>G[g].food?info.food/G[g].kcal:(info.imp[g]||0);
const cutNeed=(info,g,q)=>{if(G[g].food)info.food=Math.max(0,info.food-q*G[g].kcal);else info.imp[g]=Math.max(0,(info.imp[g]||0)-q)};
function ship(D,N,g,q){const hops=Math.abs(D.i-N.i);let loss=P.distance?0.035*hops:0,toll=0;if(P.distance&&hops===2)loss+=0.01;if(P.rivalry&&hops===2)toll=0.08;
  const arrive=q*(1-loss-toll);D.store[g]=Math.max(0,(D.store[g]||0)-q);add(N.store,g,arrive);if(toll>0)add(S.worlds[1].store,g,q*toll);
  S.flow.push([D.i,N.i,g,q,arrive]);add(D.tradeOut,g,q);add(N.tradeIn,g,arrive);return arrive}
// move goods of kind g (or any food, when g is 'food') from D to N; hooks decide how much and what is paid
function moveGoods(D,N,g,need,gf,info,lim,after){const iD=info[D.i],iN=info[N.i];
  for(const f of (g==='food'?BY_FRESH:[g])){if(need<=0.01)break;const av=(iD.off[f]||0)*gf;if(av<=0.001)continue;
    let q=Math.min(av,g==='food'?need/G[f].kcal:need);if(lim)q=lim(f,q);if(INT[f])q=Math.floor(q+1e-9);if(q<=0.001)continue;
    const arrive=ship(D,N,f,q);iD.off[f]=(iD.off[f]||0)-q;need-=g==='food'?arrive*G[f].kcal:arrive;cutNeed(iN,f,arrive);if(after)after(f,q)}
  return need}
function trade(){
  const info=S.worlds.map(w=>balance(w));S.info=info;
  const hungerOf=w=>w.hungryN||0,order=[...S.worlds].sort((a,b)=>hungerOf(b)-hungerOf(a));
  const goods=['food','med','tool','salt','wood','cloth','pot','shell'];
  for(const g of goods)for(const N of order){
    if(g==='shell'&&P.mode==='money')continue;
    const iN=info[N.i];let need=g==='food'?iN.food:(iN.imp[g]||0);if(!(need>(g==='food'?1000:0.01)))continue;
    const donors=S.worlds.filter(D=>D!==N&&(g==='food'?BY_FRESH.some(f=>(info[D.i].off[f]||0)>0.01):(info[D.i].off[g]||0)>0.01));
    if(!donors.length){N.why[g]={code:'none',need};continue}
    donors.sort((a,b)=>S.rel[b.i][N.i]-S.rel[a.i][N.i]);
    let blocked=null,poor=null,stingy=null;
    for(const D of donors){if(need<=(g==='food'?1000:0.01))break;const before=need;
      if(P.mode==='free'){const rel=S.rel[D.i][N.i];if(rel<-0.1){blocked=D;continue}
        let gf=0.4+0.6*trait(D,'gen');if(P.rivalry)gf*=0.65;if(P.share)gf=Math.min(1,gf*1.25+0.1);gf*=clamp(0.55+0.55*rel,0.3,1);if(P.greed)gf*=1-0.3*(1-trait(D,'hon'));
        need=moveGoods(D,N,g,need,gf,info);if(need>before*0.15&&gf<0.85)stingy=D}
      else if(P.mode==='money'){const iDn=info[D.i];void iDn;
        const pr=f=>S.prices[f]*(1+0.2*(trait(D,'bar')-trait(N,'bar')));

const since=(k,n=13)=>{const L=S.hist[S.hist.length-1]||{},A=ago(n);return Math.max(0,(L[k]||0)-(A[k]||0))};

function whyText(w,g){const y=w.why&&w.why[g];if(!y)return'';const by=S.worlds.find(o=>o.id===y.by),mode=S.P.mode,gn=GN[g]||g;
  if(y.code==='none')return`别的地区也没有多余的${gn}`;
  if(!by)return'';
  if(y.code==='blocked')return`${by.name}的代表${repN(by)}不再送${gn}来了：他觉得${w.name}给的回报太少`;

  if(y.code==='stingy')return`${by.name}的代表${repN(by)}只肯给一部分${gn}${S.P.rivalry?'，他想先顾自己的地区':'，他不够慷慨'}`;

function diagnose(){const P=S.P,L=S.hist[S.hist.length-1];if(!L)return[];const out=[],se=season(S.t);
  const M=S.worlds[0],V=S.worlds[1],C=S.worlds[2];

    // hunger

      if(w.event&&['drought','locust','storm','fire'].includes(w.event))bn.push(`${w.name}正在闹${EVN[w.event]}，今年收成少`);
      const wt=whyText(w,'food');if(wt)bn.push(wt);
      if(w.id==='mountain'&&!wt)bn.push('山上的梯田很小，山薯和打猎只够一半人吃');
      if(w.id==='coast'&&S.res.fish<0.5)bn.push(`海里的鱼只剩 ${pct(S.res.fish)}，打不到多少`);
      if(w.id==='village'){const fm=w.hhs.reduce((a,h)=>a+h.members.filter(p=>p.job==='farmer').length,0);if(fm>48)bn.push(`稻田就那么大，种田的人多到 ${fm} 人也种不出更多`);if(P.freeRide&&L.effort<0.85)bn.push(`有人偷懒，干活劲头只有 ${pct(L.effort)}`)}
      if(P.mode==='free'&&P.greed&&w.id!=='village')bn.push('人人都想多拿一点，交到仓库的东西变少了');
      if(w.queue>2)bn.push(`仓库管事太少，每周有 ${w.queue} 户排不上队`);
      if(!bn.length)bn.push('粮食不够分');
      const sv=since('cStarve'),fl=since('cFled'),cons=[];if(sv)cons.push(`最近三个月三个地区一共饿死 ${sv} 人`);if(fl)cons.push(`${fl} 人逃荒去了别的地区`);if(!cons.length)cons.push('吃不饱的人身体变差，生病的人变多；再这样下去会有人饿死');
      out.push({sev:0.5+Math.min(0.5,sv*0.05+st.hungry/Math.max(1,st.pop)),cls:'bad',tag:'缺粮',worlds:[w.id],q:`${w.name}有 ${st.hungry} 人吃不饱`,b:bn.slice(0,2).join('；'),c:cons.join('，')+'。'})}
    // medicine
    if(st.noMed>0||(w.why&&w.why.med&&st.sick>2)){const bn=[];if(w.id==='mountain'){const md=w.hhs.reduce((a,h)=>a+h.members.filter(p=>p.job==='medic').length,0);bn.push(`山区采药制药的只有 ${md} 人，药不够用`)}else{const t=whyText(w,'med');bn.push(t||'药只有山区才做，要从山上运来')}
      out.push({sev:0.4+Math.min(0.5,st.noMed*0.1),cls:'bad',tag:'缺药',worlds:[w.id],q:`${w.name}有 ${st.noMed} 个病人拿不到药`,b:bn.join('；'),c:(since('cNoMed')?`最近三个月有 ${since('cNoMed')} 人生病没药去世`:'病好得慢，生病的人干不了活，重病的人会去世')+'。'})}
    // tools
    if((st.tool||1)<0.5){const bn=[];if(w.id==='mountain'){const sm=w.hhs.reduce((a,h)=>a+h.members.filter(p=>p.job==='smith'&&!p.sick).length,0);bn.push(sm<2?`铁匠只有 ${sm} 人`:'铁匠打工具的速度赶不上坏的速度')}else{const t=whyText(w,'tool');bn.push(t||'铁器工具只有山区的铁匠铺打得出来')}
      out.push({sev:0.35+(0.5-st.tool),cls:'warn',tag:'缺工具',worlds:[w.id],q:`${w.name}的铁器工具坏了没得换（只剩 ${pct(st.tool)}）`,b:bn.join('；'),c:`没有好工具，干活效率降了大约 ${pct((1-st.tool)*0.45)}，种出来的、打来的都少了。`})}
    // cold
    if(st.cold>Math.max(3,st.pop*0.06)){const t=whyText(w,'wood')||whyText(w,'cloth');out.push({sev:0.3+Math.min(0.4,st.cold/st.pop),cls:'warn',tag:'冷',worlds:[w.id],q:`${w.name}有 ${st.cold} 个人冬天挨冻`,b:t||(w.id==='mountain'?'木柴有，可是布不够，衣服穿旧了换不上':'没有足够的木柴和衣服，木柴要从山区运来'),c:(since('cCold')?`最近三个月冻死 ${since('cCold')} 人；`:'')+'挨冻的人容易感冒、身体变差。'})}

  // laziness
  if(P.freeRide&&P.mode==='free'&&L.effort<0.88)out.push({sev:0.3+(0.88-L.effort),cls:'warn',tag:'偷懒',worlds:[],q:`有人偷懒（干活劲头 ${pct(L.effort)}）`,b:'东西不要钱，干多干少拿的一样',c:'生产的东西变少，勤快的人也不高兴。'+(P.reputation?'“大家都看得见”已经让偷懒少了一些。':'')});

    if(L.gini>0.45)out.push({sev:0.25+(L.gini-0.45),cls:'warn',tag:'穷富',worlds:[],q:'有的人家贝壳越攒越多，有的人家欠着账',b:'没贝壳的人家买不起粮食和药',c:'最穷的地区最先吃不饱、看不起病。'})}

const KEYS={mode:'"free"(不要钱各取所需)|"barter"(以物易物)|"money"(用贝壳当钱)',kindness:'0到1，大家有多自觉',shellShare:'0到0.6，海边拾贝壳的人占海边干活的人的比例',
  needFirst:'布尔，代表先把东西分给最需要的人',honest:'布尔，三位代表都清廉、慷慨、勤快',share:'布尔，地区和邻居之间多互相送',elections:'布尔，每四年重新选一次代表',reputation:'布尔，谁干了多少活大家都看得见',freedom:'布尔，想干嘛就干嘛（12%的人不干活去玩）',migrate:'布尔，不开心可以搬家',priceCap:'布尔，规定价格不许涨',
  greed:'布尔，人性：都想多拿一点',freeRide:'布尔，拿不到好处就有人偷懒',corruption:'布尔，代表有私心会悄悄多留',rivalry:'布尔，地区先顾自己要价高爱设卡',disasters:'布尔，随机天灾',contagion:'布尔，传染病随商队传开',distance:'布尔，路远'};
function applyIdea(o,r,fromChat){const ch=o&&o.changes||{},done=[],patch={};
  for(const k in ch){if(!(k in KEYS))continue;let v=ch[k];
    if(k==='mode'){if(MODE_N[v]){patch.mode=v;done.push('交换方式→'+MODE_N[v])}}
    else if(typeof DEF[k]==='boolean'){patch[k]=!!v;done.push((ALLN[k]||k)+(v?' 开':' 关'))}
    else{v=Number(v);if(!isFinite(v))continue;if(k==='kindness'){if(v>1)v/=100;patch[k]=clamp(v,0,1);done.push('自觉程度→'+pct(patch[k]))}if(k==='shellShare'){if(v>1)v/=100;patch[k]=clamp(v,0,0.6);done.push('拾贝的人→'+pct(patch[k]))}}}
  Sim.setP(patch);
  const evs=Array.isArray(o&&o.events)?o.events:o&&o.event?[o.event]:[];evs.forEach(ev=>{if(!ev||!EVN[ev.type])return;const ws=ev.world==='all'?S.worlds:S.worlds.filter(w=>w.id===ev.world);(ws.length?ws:[S.worlds[(Math.random()*3)|0]]).forEach(w=>Sim.trigger2(w,ev.type));done.push(`${ev.world==='all'?'三个地区':(ws[0]||{}).name||'一个地区'}：${EVN[ev.type]}`)});
  syncUI();addLog(r,(fromChat?'（对话里提出）':'')+(o&&o.title||'新的想法'),((o&&o.explain)||'')+(done.length?`（改动：${done.join('，')}）`:'（游戏里还没有能对应的规则）'),o&&o.predict||'');render()}
function keywordIdea(t){const ch={},events=[];const has=(...a)=>a.some(x=>t.includes(x));const wid=['mountain','village','coast'].find(id=>t.includes(wname(id))||(id==='mountain'&&t.includes('山'))||(id==='village'&&t.includes('村'))||(id==='coast'&&(t.includes('海')||t.includes('贝'))));
  if(has('贝壳当钱','用钱','货币','买卖','印钱','多拾','多捡'))Object.assign(ch,{mode:'money'});else if(has('以物易物','物物交换','换东西'))ch.mode='barter';else if(has('不要钱','免费','想要就拿','随便拿','各取所需'))ch.mode='free';
  if(has('多拾贝','多捡贝','贝壳很多','印很多'))ch.shellShare=0.5;if(has('善良','自觉','好心','只拿需要'))ch.kindness=0.9;if(has('自私','多拿','贪','抢'))ch.greed=true;if(has('偷懒','不干活','懒','磨洋工'))ch.freeRide=true;
  if(has('清廉','公正','廉洁','好代表'))ch.honest=true;if(has('私心','贪污','腐败','偏心','多留'))ch.corruption=true;if(has('先顾自己','设卡','要价高','各顾各','封锁'))ch.rivalry=true;
  if(has('不选举','终身','一直当'))ch.elections=false;if(has('重新选','选举','换人'))ch.elections=true;
  if(has('看得见','公开','记录','监督'))ch.reputation=true;if(has('互相帮','分享','帮忙'))ch.share=true;if(has('搬家','迁徙','移民'))ch.migrate=true;if(has('想干嘛','自由','玩','画画'))ch.freedom=true;if(has('最需要','按需','先给'))ch.needFirst=true;
  if(has('不许涨','限价','不准涨','规定价格'))ch.priceCap=true;if(has('传染','疫情'))ch.contagion=true;if(has('路远','运输','距离','翻山'))ch.distance=true;if(has('天灾'))ch.disasters=true;
  for(const[k,v]of[['干旱','drought'],['旱','drought'],['山火','fire'],['火灾','fire'],['风暴','storm'],['台风','storm'],['塌方','collapse'],['蝗','locust'],['瘟疫','plague'],['生病','plague'],['丰收','bumper'],['寒冬','winter'],['特别冷','winter']])if(t.includes(k)){events.push({type:v,world:v==='winter'?'all':wid||'all'});break}
  return{title:t.slice(0,16),changes:ch,events,explain:'按关键词理解了你的想法。',predict:''}}
(async()=>{try{if(window.claude&&window.claude.use)sample=await window.claude.use('sample')}catch(e){sample=null}
  $('#aiBar').hidden=!sample;$('#ideaNote').textContent=sample?'Claude 会把你的想法变成世界里的规则':'按关键词理解（在 Claude 里打开时，Claude 能理解任何想法）'})();
$('#ideaGo').onclick=async()=>{const ta=$('#ideaText'),t=ta.value.trim(),note=$('#ideaNote'),btn=$('#ideaGo');if(!t){note.textContent='先写下一个想法。';return}
  if(!sample){applyIdea(keywordIdea(t),role);ta.value='';return}
  btn.disabled=true;note.textContent='Claude 正在想…';
  const prompt=`你在帮忙运行一个给小朋友的社会模拟游戏“我的三地世界”：只有三个地区，上面是山区（6号代表，有矿、木头、药，缺粮食和盐，是唯一能做铁器工具和药品的地方），中间是乡村（7号代表，种稻谷，缺铁器、药和木柴），下面是海边（9号代表，有鱼、盐和很多贝壳，缺粮食、木柴、铁器和药；贝壳可以当钱，也是稻田的肥料）。三位代表是选出来的，各管一个地区，每个人都有名字、年龄、家庭、工作，有四季、生老病死。
小朋友提出理想的假设，爸爸妈妈提出现实世界的制约。现在提想法的人是：${role==='kid'?'小朋友':'爸爸妈妈'}。
当前参数：${JSON.stringify(S.P)}
可以改的参数：${JSON.stringify(KEYS)}
可以触发的事件 type：drought 干旱 / storm 风暴 / fire 山火 / collapse 矿井塌方 / locust 蝗灾 / plague 瘟疫 / bumper 大丰收 / winter 寒冬；world 为 mountain、village、coast 或 "all"。
想法：“${t}”
把这个想法翻译成参数改动和事件。只改和想法有关的。只回复一个 JSON 对象：
{"title":"不超过12个字的短标题","changes":{"参数名":新值},"events":[],"explain":"用小朋友听得懂的话，1到2句说明你怎么理解这个想法、改了什么","predict":"1句话预测接下来可能发生什么，以及为什么"}
如果现有参数表达不了，就选最接近的，并在 explain 里说清楚游戏里还做不到哪部分。`;
  try{const o=await sample.json(prompt,{modelTier:'quick'});applyIdea(o&&typeof o==='object'?o:keywordIdea(t),role);ta.value='';note.textContent='已经放进世界里了。'}
  catch(e){if(e&&(e.code==='not_granted'||e.code==='sampling_disabled')){sample=null;$('#aiBar').hidden=true}applyIdea(keywordIdea(t),role);ta.value='';note.textContent=e&&e.code==='rate_limited'?'Claude 有点忙，先按关键词理解了。':'先按关键词理解了。'}
  finally{btn.disabled=false}};
$('#aiBtn').onclick=async()=>{if(!sample)return;const out=$('#aiOut'),btn=$('#aiBtn');out.hidden=false;out.textContent='Claude 正在看这个世界…';btn.disabled=true;
  const h=S.hist.filter((x,i)=>i%8===7||i===S.hist.length-1).slice(-30).map(x=>({周:x.t,模式:x.mode,人口:x.pop,吃饱:Math.round(x.kcov*100),健康:Math.round(x.health*100),开心:Math.round(x.happy*100),贫富:+x.gini.toFixed(2),米价:x.apple&&+x.apple.toFixed(1),鱼:Math.round(x.fish*100)}));
  const ws=S.wstat.map(w=>({地区:wname(w.id),代表:repN(S.worlds.find(o=>o.id===w.id)),人口:w.pop,吃饱:Math.round(w.kcov*100),健康:Math.round(w.health*100),开心:Math.round(w.happy*100),缺药:w.noMed,吃不饱:w.hungry}));
  const lg=S.log.slice(0,12).reverse().map(e=>`${Sim.when(e.t)} ${e.role==='kid'?'小朋友':e.role==='parent'?'家长':'世界'}：${e.title}`);
  try{await sample(`你在给一个小朋友和家长解读社会模拟游戏“我的三地世界”的结果。山区（6号郑铁山等）、乡村（7号）、海边（9号）三个地区各由选出来的代表管着，互相交换东西：山区出铁器、药和木柴，缺粮；乡村出粮食，缺铁器、药和木柴；海边出鱼、盐、贝壳，缺粮和木柴。
当前规则：${JSON.stringify(S.P)}
规则变化：${lg.join('；')}
现在最要紧的问题：${JSON.stringify(PROBS.map(p=>({问题:p.q,瓶颈:p.b,后果:p.c})))}
每两个月的数据：${JSON.stringify(h)}
现在各地区：${JSON.stringify(ws)}
死亡原因统计：${JSON.stringify(S.cnt.by)}
请用小朋友能听懂的中文写 5 到 7 句话：发生了什么、为什么（指出是哪条规则、哪位代表的性格或哪种人性造成的），现实世界历史上有没有类似的事。最后提一个让小朋友想一想的问题。不要用标题和列表符号。`,{onText:({text})=>{out.textContent=text},cache:false})}
  catch(e){out.textContent=e&&e.code==='not_granted'?'没有允许 Claude 使用，所以讲不了。':'这次没讲成，过一会儿再试。'}finally{btn.disabled=false}};

// ================= live updates from GitHub =================
const BUILD=8,LIVE={"build": 8, "params": {}, "commands": [], "rules": 3, "simHash": "56c183ff1f4f", "uiHash": "dd1634a3b1a2"};let RULES=LIVE.rules||1;
const REPO='Yifeng-LIN/Yifeng-LIN.github.io',BRANCH='claude/ecstatic-faraday-e7tjvq';
const liveNote=t=>{$('#tickNote').textContent=t};
function applyLive(L){if(!L)return 0;S.liveSeen=S.liveSeen||[];let n=0;
  (L.commands||[]).forEach(c=>{if(!c||S.liveSeen.includes(c.id))return;S.liveSeen.push(c.id);n++;
    if(c.reset){const keep=S.liveSeen.slice(),lg=S.log.slice();start({...S.P,...(c.changes||{})});S.liveSeen=keep;S.log=lg;addLog(c.role||'sys','（对话里提出）'+(c.title||'从头再来'),c.explain||'用新的规则重新开始。',c.predict||'')}
    else applyIdea(c,c.role||'parent',true)});
  if(n)render();return n}
let lastSha=null,fails=0,pollTimer=null;
async function swapRules(sha,v){let code;try{code=await (await fetch(`https://raw.githubusercontent.com/${REPO}/${sha}/jiugong/sim.js`)).text()}catch(e){liveNote('新规则下载失败，下次再试');lastSha=null;return}
  let NS;try{NS=new Function(code+'\n;return Sim')()}catch(e){liveNote('新规则的代码有错，先不换');return}
  try{NS.load(Sim.save())}catch(e){liveNote('新规则和现在的世界对不上，先不换（点“从头再来”可以用新规则）');return}
  Sim=NS;bindSim();S=Sim.S;fx.traders.length=0;RULES=v;
  addLog('sys',`换上了第 ${v} 版规则`,'只换了规则：世界、播放速度、正在看的地方都没变。');render()}
async function poll(){clearTimeout(pollTimer);
  try{const r=await fetch(`https://api.github.com/repos/${REPO}/commits/${BRANCH}`,{cache:'no-cache'});
    if(r.status===403||r.status===429){liveNote('GitHub 暂时不让查了，1 分钟后再试');pollTimer=setTimeout(poll,60000);return}
    if(!r.ok)throw new Error(r.status);const j=await r.json(),sha=j.sha;fails=0;
    if(sha&&sha!==lastSha){const L=await (await fetch(`https://raw.githubusercontent.com/${REPO}/${sha}/jiugong/live.json`)).json();lastSha=sha;
      if(L.build>BUILD){liveNote('界面有新版本，正在换上（世界接着跑）…');
        try{const html=await (await fetch(`https://raw.githubusercontent.com/${REPO}/${sha}/jiugong/game.html`)).text();
          sessionStorage.setItem('jiugong:code',JSON.stringify({build:L.build,html}));sessionStorage.setItem('jiugong:state',Sim.save());sessionStorage.setItem('jiugong:run',running?'1':'0');
          sessionStorage.setItem('jiugong:ui',JSON.stringify({speed,sel,tab,selPerson,y:scrollY,idea:$('#ideaText').value,role}));location.reload();return}
        catch(e){liveNote('界面有新版本，请手动刷新页面')}}
      else if((L.rules||1)>RULES)await swapRules(sha,L.rules);
      const n=applyLive(L);if(n)addLog('sys',`从 GitHub 收到 ${n} 个新想法`,(j.commit&&j.commit.message||'').split('\n')[0])}
    const tm=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    liveNote(`已连接 GitHub，每 10 秒检查一次 · 界面第 ${BUILD} 版 · 规则第 ${RULES} 版 · ${tm}`);pollTimer=setTimeout(poll,10000)}
  catch(e){fails++;liveNote(fails>2?'连不上 GitHub，1 分钟后再试':'正在连接 GitHub…');pollTimer=setTimeout(poll,fails>2?60000:10000)}}

// ================= boot =================
function start(p){Sim.newGame(p||{},Math.floor(Math.random()*1e9));S=Sim.S;for(const k in folk)delete folk[k];fx.traders.length=0;cache.clear();for(let i=0;i<3;i++)Sim.step();syncUI()}
const ss=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},ssDel=k=>{try{sessionStorage.removeItem(k)}catch(e){}};
function boot(d){d=d||{};fit();let restored=false,wasRunning=null;
  try{const st=d.state||ss('jiugong:state');if(st){Sim.load(st);S=Sim.S;restored=true;wasRunning=d.state?d.running:ss('jiugong:run')!=='0'}}catch(e){restored=false}
  ssDel('jiugong:state');ssDel('jiugong:run');
  if(restored){syncUI();addLog('sys',`换上了第 ${BUILD} 版`,'代码更新了，世界接着跑，没有重来。')}
  else{start(LIVE.params||{});S.liveSeen=(LIVE.commands||[]).map(c=>c.id);
    addLog('sys','第一次选举',`山区的郑铁山（6 号，46 票）、乡村的杨满仓（7 号，55 票）、海边的何贝娜（9 号，32 票）当选各自地区的代表。${Object.keys(LIVE.params||{}).length?'按对话里最新的规则开始。':'现在没有打开任何现实制约。'}`)}
  applyLive(LIVE);
  try{const ui=JSON.parse(ss('jiugong:ui')||'null');ssDel('jiugong:ui');if(ui&&restored){speed=ui.speed||1;$('#speed').textContent=`速度 ${speed}×`;sel=ui.sel||null;selPerson=ui.selPerson||null;role=ui.role||role;if(sel)$('#detailPanel').hidden=false;
    document.querySelectorAll('.who-toggle button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.r===role)));if(ui.idea)$('#ideaText').value=ui.idea;setTab(ui.tab||'world');requestAnimationFrame(()=>scrollTo(0,ui.y||0))}}catch(e){}
  render();requestAnimationFrame(frame);
  let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{fit();render()},120)});
  const rethemes=()=>render();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rethemes);new MutationObserver(rethemes).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  if(wasRunning!=null?wasRunning:!reduceMotion)setRun(true);
  if(!window.claude)poll();else liveNote(`界面第 ${BUILD} 版 · 规则第 ${RULES} 版`)}
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(()=>({state:Sim.save(),running}))}catch(e){}
if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data||{});
})();
