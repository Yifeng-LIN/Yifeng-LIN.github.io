<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Maths CM2</title>
<style>

:root{
  --jaune:#F2C200; --orange:#F08A24; --verte:#2E9E4F; --bleue:#2F6FD6; --marron:#7B4A1E; --noire:#222222; --dan:#7A1FA2;
  --ok:#1E7B34; --ok-clair:#E3F5E7; --non:#D8600A; --non-clair:#FDEEE2;
  --encre:#1C1C1C; --gris:#6B6B6B; --bord:#D9D9D9; --fond:#FFFFFF; --fond2:#F6F6F6; --carte:#FFFFFF;
  --conj:#7B3FA0; --ortho:#C2185B; --maths:#1565C0; --lect:#00796B; --dictee:#AD1457;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --encre:#F2F2F2; --gris:#B5B5B5; --bord:#3A3A3A; --fond:#141414; --fond2:#1F1F1F; --carte:#1B1B1B;
    --ok-clair:#163B21; --non-clair:#3E2410;
  }
}
:root[data-theme="dark"]{
  --encre:#F2F2F2; --gris:#B5B5B5; --bord:#3A3A3A; --fond:#141414; --fond2:#1F1F1F; --carte:#1B1B1B;
  --ok-clair:#163B21; --non-clair:#3E2410;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--fond); color:var(--encre);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:20px; line-height:1.45; padding:16px; max-width:760px; margin:0 auto;
  -webkit-text-size-adjust:100%;
}
h1{font-size:28px;margin:0 0 2px;letter-spacing:-0.3px;}
h2{font-size:24px;margin:0 0 10px;}
h3{font-size:19px;margin:18px 0 8px;}
p{margin:0 0 12px;}
.sous{color:var(--gris);font-size:17px;margin:0 0 18px;}
.ecran{display:none;}
.ecran.actif{display:block;animation:app .18s ease;}
@keyframes app{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
button{
  font-family:inherit;font-size:20px;min-height:56px;border-radius:12px;
  border:2px solid var(--bord);background:var(--carte);color:var(--encre);
  cursor:pointer;padding:10px 16px;transition:background .12s ease,border-color .12s ease,transform .08s ease;
}
button:active{transform:scale(.98);}
button:disabled{opacity:.45;cursor:not-allowed;}
.principal{background:var(--jaune);border-color:var(--jaune);color:#1C1C1C;font-weight:700;width:100%;margin-top:18px;}
.discret{border:none;background:none;color:var(--gris);font-size:17px;min-height:44px;padding:8px;}
.haut{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-right:56px;padding-left:30px;}
.roue{border:none;background:none;font-size:26px;min-height:44px;width:44px;padding:0;opacity:.45;flex:0 0 auto;}
.retour{display:inline-block;margin-bottom:8px;}


.ceinture{display:inline-block;width:46px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.25);vertical-align:middle;}
.ceinture.big{width:100%;height:22px;border-radius:5px;}


.matieres{display:grid;gap:12px;margin-top:10px;}
.mat{
  display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;min-height:84px;
  border-width:3px;border-left-width:12px;
}
.mat .ico{font-size:32px;flex:0 0 auto;}
.mat .txt{flex:1;}
.mat .txt b{display:block;font-size:22px;}
.mat .txt small{display:block;color:var(--gris);font-size:15px;margin-top:2px;}
.mat.conj{border-left-color:var(--conj);} .mat.ortho{border-left-color:var(--ortho);}
.mat.maths{border-left-color:var(--maths);} .mat.lect{border-left-color:var(--lect);} .mat.dictee{border-left-color:var(--dictee);}
.regles{background:var(--fond2);border-radius:14px;padding:14px 16px;margin-top:18px;font-size:17px;color:var(--gris);}
.regles b{color:var(--encre);}


.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;}
.chip{
  flex:0 0 auto;min-height:48px;padding:6px 12px;border-radius:999px;font-size:16px;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.chip .ceinture{width:26px;height:9px;}
.chip.sel{border-color:var(--encre);background:var(--fond2);}
.chip.gagnee{border-style:solid;}
.chip.verrou{opacity:.55;}
.etapes{display:grid;gap:10px;margin-top:6px;}
.etape{
  display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:80px;
}
.etape .num{
  flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:18px;background:var(--fond2);
}
.etape .txt{flex:1;}
.etape .txt b{display:block;font-size:17px;color:var(--gris);font-weight:700;}
.etape .txt span{display:block;font-size:18px;line-height:1.3;}
.etape .etat{flex:0 0 auto;font-size:15px;color:var(--gris);text-align:right;white-space:nowrap;}
.etape.fait{background:var(--ok-clair);border-color:var(--ok);}
.etape.fait .num{background:var(--ok);color:#fff;}
.etape.bloque{opacity:.55;border-style:dashed;}
.gagne{
  margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--fond2);font-size:17px;color:var(--gris);
}


.lecon{
  background:var(--fond2);border:3px solid var(--jaune);border-radius:16px;padding:18px 18px;margin:14px 0;
}
.lecon .etiquette{font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:var(--gris);font-weight:700;margin-bottom:8px;}
.lecon p{font-size:20px;line-height:1.55;margin:0;}
.lecon b{background:var(--carte);padding:1px 6px;border-radius:5px;}
.tableconj{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
.tableconj div{background:var(--carte);border-radius:10px;padding:10px 12px;font-size:18px;line-height:1.5;}
.tableconj div b{display:block;background:none;padding:0;margin-bottom:4px;color:var(--conj);}


.jauge{display:flex;gap:5px;margin:4px 0 6px;}
.plot{flex:1;height:12px;border-radius:6px;background:var(--bord);}
.plot.ok{background:var(--ok);}
.compteur{font-size:16px;color:var(--gris);margin:0 0 14px;display:flex;justify-content:space-between;padding-right:44px;}
.consigne{font-size:18px;color:var(--gris);margin:0 0 10px;}
.enonce{
  font-size:27px;line-height:1.5;border:2px solid var(--bord);border-radius:14px;
  padding:20px 18px;margin-bottom:16px;word-wrap:break-word;background:var(--carte);
}
.enonce .mini{display:block;font-size:17px;color:var(--gris);margin-bottom:6px;}
.trou{display:inline-block;min-width:60px;border-bottom:4px solid var(--jaune);text-align:center;}
.choix{display:grid;gap:10px;grid-template-columns:1fr 1fr;}
.choix.trois{grid-template-columns:1fr 1fr 1fr;}
.choix.un{grid-template-columns:1fr;}
.choix button{font-size:24px;font-weight:600;min-height:64px;padding:8px 6px;word-break:normal;overflow-wrap:anywhere;hyphens:auto;}
.choix button.long{font-size:20px;}
.choix.trois button.long{font-size:16px;line-height:1.2;}
.choix.cartes.trois{grid-template-columns:1fr;}
.saisie{
  font-size:38px;font-weight:700;min-height:70px;border:2px solid var(--bord);border-radius:14px;
  display:flex;align-items:center;justify-content:center;margin-bottom:12px;letter-spacing:2px;
  font-variant-numeric:tabular-nums;background:var(--carte);
}
.saisie.vide{color:var(--gris);font-weight:400;font-size:20px;letter-spacing:0;}
.pave{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pave button{font-size:26px;font-weight:600;min-height:60px;}
.pave .valider{background:var(--jaune);border-color:var(--jaune);color:#1C1C1C;font-weight:700;}


.bandeau{border-radius:16px;padding:24px 20px;margin:10px 0 4px;text-align:center;}
.bandeau.ok{background:var(--ok-clair);border:3px solid var(--ok);}
.bandeau.recommence{background:var(--non-clair);border:3px solid var(--non);}
.bandeau h2{margin:0 0 6px;font-size:28px;}
.bandeau.ok h2{color:var(--ok);} .bandeau.recommence h2{color:var(--non);}
.bandeau .grand{font-size:60px;line-height:1;margin:6px 0 10px;}
.coupdepouce{background:var(--carte);border-radius:12px;padding:16px;margin-top:16px;text-align:left;font-size:19px;line-height:1.55;}
.coupdepouce .titre{font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:var(--non);font-weight:700;margin-bottom:8px;}
.coupdepouce .bonne{font-size:22px;margin-bottom:10px;}
.coupdepouce .bonne b{background:var(--ok-clair);padding:2px 8px;border-radius:6px;}
.aecrire{margin-top:14px;font-size:17px;border-top:2px dashed var(--bord);padding-top:12px;color:var(--gris);text-align:left;}
.chrono-res{font-size:17px;color:var(--gris);margin-top:8px;}


.objectif{background:var(--fond2);border-radius:14px;padding:16px;font-size:20px;line-height:1.5;margin-bottom:14px;}
.chrono{
  font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px;
  border:2px solid var(--bord);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--carte);
}
.chrono.fini{border-color:var(--ok);color:var(--ok);}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.check{display:grid;gap:8px;margin:12px 0;}
.check label{display:flex;align-items:center;gap:12px;font-size:19px;min-height:52px;border:2px solid var(--bord);border-radius:12px;padding:8px 12px;background:var(--carte);}
.check input{width:26px;height:26px;flex:0 0 auto;}


.tablebox{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 20px;}
table{border-collapse:collapse;width:100%;font-size:15px;}
th,td{border:1px solid var(--bord);padding:7px 6px;text-align:left;vertical-align:top;}
th{background:var(--fond2);font-weight:700;}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.barre{display:inline-block;height:10px;background:var(--non);border-radius:5px;vertical-align:middle;}
.ligne{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:1px solid var(--bord);padding:6px 0;font-size:18px;}
.ligne small{display:block;color:var(--gris);font-size:14px;}
.switch{width:64px;height:36px;border-radius:999px;border:2px solid var(--bord);background:var(--fond2);position:relative;flex:0 0 auto;min-height:36px;padding:0;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--gris);transition:left .15s ease,background .15s ease;}
.switch.on{background:var(--ok-clair);border-color:var(--ok);}
.switch.on::after{left:31px;background:var(--ok);}
.boutons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.boutons button{font-size:17px;}
.petit{font-size:15px;color:var(--gris);}
@media (max-width:420px){
  body{font-size:18px;padding:12px;}
  .enonce{font-size:24px;padding:16px 14px;}
  .choix button{font-size:21px;}
  .choix.trois{grid-template-columns:1fr;}
}


body{background:var(--fond) radial-gradient(circle at 50% -20%, rgba(242,194,0,.16), transparent 55%) no-repeat;}
.haut .actions{display:flex;gap:2px;flex:0 0 auto;}
.roue{opacity:.6;}
.mascotte-bloc{display:flex;align-items:flex-end;gap:12px;margin:6px 0 14px;}
.mascotte{width:110px;flex:0 0 auto;animation:respire 3s ease-in-out infinite;}
.mascotte.petite{width:76px;}
.mascotte.joie{animation:saute .7s ease-in-out infinite;}
.mascotte.triste{animation:none;transform:rotate(-4deg);}
.bulle{
  position:relative;flex:1;background:var(--carte);border:2px solid var(--bord);border-radius:16px;
  padding:12px 14px;font-size:18px;line-height:1.4;
}
.bulle::before{content:"";position:absolute;left:-12px;bottom:18px;border:8px solid transparent;border-right-color:var(--bord);border-left:0;}
.bulle::after{content:"";position:absolute;left:-9px;bottom:19px;border:7px solid transparent;border-right-color:var(--carte);border-left:0;}
.bulle b{color:var(--conj);}
@keyframes respire{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.02)}}
@keyframes saute{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-3deg)}60%{transform:translateY(-16px) rotate(3deg)}}


.mat{border-radius:18px;box-shadow:0 3px 0 var(--bord);transition:transform .1s ease;}
.mat:active{transform:translateY(2px);box-shadow:none;}
.mat .ico{font-size:40px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15));}
.etoiles{font-size:15px;letter-spacing:1px;}


.but{
  background:linear-gradient(135deg, rgba(242,194,0,.18), rgba(46,158,79,.12));
  border:2px solid var(--bord);border-radius:16px;padding:14px 16px;margin:12px 0;
}
.but .etiquette{font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:var(--gris);font-weight:700;margin-bottom:6px;}
.but p{font-size:19px;line-height:1.5;margin:0;}
.adversaire{
  display:flex;align-items:center;gap:14px;background:var(--fond2);border-radius:16px;padding:12px 14px;margin:12px 0;
}
.adversaire .mob{font-size:56px;line-height:1;animation:respire 2.4s ease-in-out infinite;}
.adversaire .txt{font-size:17px;line-height:1.4;}
.adversaire .txt b{font-size:20px;}


.arene{
  display:flex;align-items:center;gap:12px;background:var(--fond2);border-radius:16px;padding:10px 14px;margin-bottom:12px;
}
.monstre{font-size:64px;line-height:1;flex:0 0 auto;display:inline-block;animation:respire 2.4s ease-in-out infinite;position:relative;}
.monstre.touche{animation:secoue .5s ease;}
.monstre.rit{animation:rigole .8s ease;}
@keyframes secoue{0%{transform:translateX(0) rotate(0)}20%{transform:translateX(-10px) rotate(-8deg)}40%{transform:translateX(10px) rotate(8deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}100%{transform:translateX(0)}}
@keyframes rigole{0%,100%{transform:scale(1)}25%{transform:scale(1.25) rotate(-6deg)}50%{transform:scale(1.15) rotate(6deg)}75%{transform:scale(1.25) rotate(-6deg)}}
.pv{flex:1;}
.pv .nom{font-size:16px;color:var(--gris);display:flex;justify-content:space-between;margin-bottom:4px;}
.pv .nom b{color:var(--encre);}
.jauge{margin:0;}
.plot{height:14px;background:var(--non);transition:background .25s ease;}
.plot.ok{background:var(--bord);}
.combo{font-size:15px;color:var(--non);font-weight:700;margin-top:4px;min-height:20px;}
.degats{
  position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:22px;font-weight:800;color:var(--ok);
  animation:monte .9s ease forwards;pointer-events:none;white-space:nowrap;
}
@keyframes monte{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-40px)}}
.choix button, .pave button{box-shadow:0 3px 0 var(--bord);}
.choix button:active, .pave button:active{transform:translateY(2px);box-shadow:none;}
.pave .valider{box-shadow:0 3px 0 #B08F00;}
.principal{box-shadow:0 4px 0 #B08F00;font-size:22px;min-height:62px;}
.principal:active{transform:translateY(3px);box-shadow:none;}


.bandeau .grand{animation:pop .6s cubic-bezier(.2,1.6,.4,1);}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.etoiles-grandes{font-size:44px;letter-spacing:4px;margin:4px 0 8px;}
.etoiles-grandes span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;}
.etoiles-grandes span:nth-child(2){animation-delay:.15s}.etoiles-grandes span:nth-child(3){animation-delay:.3s}
.ceinture.big.brille{animation:brille 1.6s ease-in-out infinite;}
@keyframes brille{0%,100%{box-shadow:0 0 0 0 rgba(242,194,0,.0)}50%{box-shadow:0 0 22px 6px rgba(242,194,0,.55)}}
.ruban{
  font-size:96px;line-height:1;animation:pop .8s cubic-bezier(.2,1.6,.4,1) both;
}
.confetti{position:fixed;top:-12px;width:10px;height:16px;border-radius:2px;pointer-events:none;z-index:50;animation:tombe linear forwards;}
@keyframes tombe{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:.8}}
.flash{animation:flashNon .4s ease;}
@keyframes flashNon{0%{background-color:rgba(216,96,10,.25)}100%{background-color:transparent}}
.chip.gagnee{box-shadow:0 0 0 2px rgba(46,158,79,.4);}


.visuel{
  display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  background:var(--carte);border:2px solid var(--bord);border-radius:16px;padding:14px 12px;margin-bottom:12px;
}
.visuel.colonne{flex-direction:column;}
.groupe{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:300px;padding:8px;border-radius:14px;background:var(--fond2);}
.groupe.petits .obj{font-size:24px;width:32px;height:32px;}
.obj{
  font-size:34px;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
  position:relative;cursor:pointer;border-radius:10px;user-select:none;transition:transform .12s ease;
  animation:pop .4s cubic-bezier(.2,1.6,.4,1) both;
}
.obj:active{transform:scale(1.25);}
.obj.compte{background:var(--ok-clair);box-shadow:inset 0 0 0 2px var(--ok);}
.obj.compte::after{content:attr(data-n);position:absolute;right:-4px;top:-6px;background:var(--ok);color:#fff;font-size:13px;font-weight:700;border-radius:999px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 4px;}
.obj.mange{opacity:.3;filter:grayscale(1);}
.obj.mange::before{content:"✖";position:absolute;color:var(--non);font-size:30px;opacity:.9;}
.monstre-mange{font-size:40px;align-self:flex-end;}
.vide{font-size:30px;color:var(--gris);text-align:center;line-height:1.1;}
.opsign{font-size:36px;font-weight:800;color:var(--gris);padding:0 4px;}
.astuce-compte{font-size:15px;color:var(--gris);margin:-6px 0 12px;text-align:center;}
.reflet .obj{transform:scaleX(-1);opacity:.75;}
.miroir{font-size:40px;}
.singes{font-size:38px;margin-top:6px;}
.singes .q{font-size:26px;font-weight:800;color:var(--non);vertical-align:middle;}

.dix{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#C48A3F;padding:8px;border-radius:12px;}
.dix .case{width:50px;height:50px;background:#E8C79A;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:inset 0 3px 6px rgba(0,0,0,.25);}
.dix .case.plein{background:#F3E1C2;}

.blocs-wrap{gap:8px;}
.blocs{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;justify-content:center;}
.grp{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end;max-width:180px;justify-content:center;}
.b100{width:46px;height:46px;background:repeating-linear-gradient(90deg,#2E9E4F 0 3.6px,#fff 3.6px 4.6px),#2E9E4F;background-blend-mode:multiply;border:1px solid #1e6b35;border-radius:3px;
  background-image:repeating-linear-gradient(90deg,transparent 0 3.6px,rgba(255,255,255,.55) 3.6px 4.6px),repeating-linear-gradient(0deg,transparent 0 3.6px,rgba(255,255,255,.55) 3.6px 4.6px);background-color:#2E9E4F;}
.b10{width:11px;height:46px;background-color:#2F6FD6;border:1px solid #1d4a94;border-radius:2px;background-image:repeating-linear-gradient(0deg,transparent 0 3.6px,rgba(255,255,255,.55) 3.6px 4.6px);}
.b1{width:11px;height:11px;background:#F08A24;border:1px solid #a85a10;border-radius:2px;}
.retire{opacity:.25;position:relative;}
.retire::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:3px;background:var(--non);transform:rotate(-20deg);}
.legende{font-size:15px;color:var(--gris);text-align:center;margin:-6px 0 12px;}

.croco{gap:6px;}
.assiette{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:110px;}
.assiette .visuel{margin:0;padding:8px;border:none;background:var(--fond2);}
.assiette .legende{display:none;}
.assiette b{font-size:30px;}
.bouche{font-size:52px;animation:respire 2s ease-in-out infinite;}

.aquarium{background:linear-gradient(#BFE6F7,#7FC8EA);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;}
.aquarium .rangee{display:flex;gap:2px;}
.aquarium .obj{font-size:26px;width:32px;height:32px;animation:none;}
.aquarium.petits .obj{font-size:19px;width:24px;height:24px;}
.vide-aq{font-size:44px;text-align:center;color:#333;line-height:1.1;}
.vide-aq small{font-size:15px;}

.boites{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.boite{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#C48A3F;padding:4px;border-radius:8px;font-size:16px;line-height:1;}

.illu{display:flex;justify-content:center;align-items:center;gap:16px;font-size:44px;margin:0 0 8px;line-height:1.2;flex-wrap:wrap;}
.illu .fleche{font-size:30px;color:var(--gris);}
.illu span{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;}

.train{display:flex;align-items:center;gap:6px;justify-content:center;margin:0 0 12px;flex-wrap:wrap;}
.loco{display:flex;flex-direction:column;align-items:center;background:var(--fond2);border:2px solid var(--bord);border-radius:14px 14px 6px 6px;padding:8px 14px;position:relative;}
.loco .avatar{font-size:44px;line-height:1;}
.loco .suj{font-size:15px;color:var(--gris);font-weight:700;}
.loco::after,.wagon::after{content:"";position:absolute;left:10px;right:10px;bottom:-9px;height:10px;background:radial-gradient(circle at 20% 50%,#555 5px,transparent 6px),radial-gradient(circle at 80% 50%,#555 5px,transparent 6px);}
.choix.wagons{grid-template-columns:1fr;gap:16px;}
.choix.wagons button{position:relative;border-radius:10px 10px 6px 6px;font-size:23px;}
.choix.wagons button::after{content:"";position:absolute;left:14px;right:14px;bottom:-10px;height:10px;background:radial-gradient(circle at 12% 50%,#555 5px,transparent 6px),radial-gradient(circle at 88% 50%,#555 5px,transparent 6px);}
.choix.wagons button::before{content:"🔗";position:absolute;left:-16px;top:50%;transform:translateY(-50%);font-size:14px;}

.choix.ballons{grid-template-columns:repeat(4,1fr);}
.choix.ballons button{border-radius:50% 50% 50% 50%/45% 45% 55% 55%;aspect-ratio:1/1.15;min-height:0;font-size:26px;color:#fff;border:none;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);animation:flotte 2.6s ease-in-out infinite;}
.choix.ballons button:nth-child(1){background:#E53935;animation-delay:0s}.choix.ballons button:nth-child(2){background:#1E88E5;animation-delay:.4s}
.choix.ballons button:nth-child(3){background:#43A047;animation-delay:.8s}.choix.ballons button:nth-child(4){background:#8E24AA;animation-delay:1.2s}
.choix.ballons button::after{content:"";display:block;width:2px;height:22px;background:var(--gris);margin:0 auto;position:absolute;left:50%;bottom:-22px;}
@keyframes flotte{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.choix.ballons{padding-bottom:22px;}

.choix.cartes button{background:#FFF8DC;color:#1C1C1C;border:2px dashed #C9A227;border-radius:6px;font-family:Georgia,serif;font-style:italic;}

.choix.bulles button{border-radius:999px;background:radial-gradient(circle at 30% 30%,#fff,var(--carte) 60%);border:3px solid #7FC8EA;box-shadow:0 4px 0 #5aa9cf;animation:flotte 3s ease-in-out infinite;}
.choix.bulles button:nth-child(2){animation-delay:.6s}.choix.bulles button:nth-child(3){animation-delay:1.2s}

.choix.signes button{font-size:40px;font-weight:800;}
.ecouter{border:none;background:var(--fond2);font-size:18px;min-height:40px;padding:4px 12px;border-radius:999px;margin-left:8px;vertical-align:middle;}
@media (max-width:420px){
  .obj{font-size:28px;width:36px;height:36px;}
  .dix .case{width:42px;height:42px;font-size:26px;}
  .choix.ballons{grid-template-columns:repeat(2,1fr);}
  .illu{font-size:36px;}
  .aquarium.petits .obj{width:21px;height:21px;font-size:16px;}
  .aquarium .obj{width:28px;height:28px;font-size:22px;}
}
.visuel{max-width:100%;overflow-x:auto;}
.aquarium{max-width:100%;}


.choix.vraifaux{grid-template-columns:1fr 1fr;}
.choix.vraifaux button{font-size:22px;min-height:76px;}
.choix.vraifaux button:nth-child(1){border-color:var(--ok);background:var(--ok-clair);}
.choix.vraifaux button:nth-child(2){border-color:var(--non);background:var(--non-clair);}
.choix.intrus{grid-template-columns:1fr;}
.choix.intrus button{font-size:21px;text-align:left;padding:14px 16px;border-width:3px;border-radius:14px;background:var(--carte);box-shadow:0 4px 0 var(--bord);}
.choix.intrus button::before{content:"🃏 ";}
.choix.mots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.choix.mots button{font-size:22px;min-height:52px;padding:6px 12px;border-radius:10px;border-bottom:4px dashed var(--jaune);}
.choix.methode{grid-template-columns:1fr 1fr;}
.choix.methode button{font-size:20px;min-height:76px;}
.loupe{margin:-4px 0 12px;text-align:center;}
.btn-loupe{font-size:17px;min-height:46px;border-radius:999px;background:var(--fond2);}
.test-box{margin-top:10px;background:var(--fond2);border:2px dashed var(--jaune);border-radius:12px;padding:10px 14px;font-size:20px;line-height:1.5;}
.coupe{font-size:19px;font-weight:700;margin:4px 0 8px;}
.etape .etat small{font-size:13px;color:var(--gris);font-weight:400;}


.jeu-shell{margin:0 -4px;}
.course{display:block;width:100%;border-radius:16px;border:2px solid var(--bord);background:#BFE3FF;touch-action:manipulation;user-select:none;}
.zone-q{margin-top:12px;}
.zone-q .compteur{margin-bottom:8px;}
.zone-q .attente-txt{color:var(--non);font-weight:700;}
.zone-q.pret .attente-txt{display:none;}
.zone-q .choix button{opacity:.45;pointer-events:none;transition:opacity .2s ease;}
.zone-q.pret .choix button{opacity:1;pointer-events:auto;}
.course-choix button{border-left:10px solid var(--pan) !important;text-align:left;}
.course-choix.ballons button, .course-choix.vraifaux button, .course-choix.methode button{text-align:center;}
.course-choix.ballons button{border-left:none !important;background:var(--pan) !important;}
.course-choix .lettre{display:inline-block;background:var(--pan);color:#fff;border-radius:6px;padding:0 8px;margin-right:8px;font-weight:800;}
.choix-jeu{background:var(--fond2);border-radius:16px;padding:12px 14px;margin:12px 0;}
.choix-jeu .etiquette{font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:var(--gris);font-weight:700;margin-bottom:8px;}
.jeux{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.jeu-chip{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:26px;min-height:64px;padding:6px 2px;border-radius:12px;}
.jeu-chip small{font-size:11px;color:var(--gris);line-height:1.1;text-align:center;}
.jeu-chip.sel{border-color:var(--encre);background:var(--carte);box-shadow:0 0 0 2px var(--jaune);}
@media (max-width:520px){ .jeux{grid-template-columns:repeat(4,1fr);} }


.scene{position:relative;}
.scene-boutons{position:absolute;top:6px;left:8px;display:flex;flex-direction:row;gap:6px;}
.scene-boutons button{width:40px;height:40px;min-height:40px;padding:0;border-radius:10px;font-size:18px;background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.15);box-shadow:0 2px 0 rgba(0,0,0,.15);}
.btn-quit{color:#B71C1C;font-weight:800;}
body.plein{max-width:none;padding:10px 16px;}
.jeu-shell{position:fixed;inset:0;z-index:100;background:var(--fond);margin:0;padding:8px;display:grid;grid-template-rows:36vh minmax(0,1fr);gap:6px;overflow:hidden;height:100vh;height:100dvh;}
.scene{min-height:0;}
.course{height:100%;border-radius:14px;}
.zone-q{min-height:0;overflow:auto;padding:0 4px 8px;}
.arreter-bas{display:none;}

.zone-q .compteur{margin:2px 0 4px;font-size:14px;}
.zone-q .consigne{font-size:16px;margin:0 0 6px;}
.zone-q .enonce{font-size:22px;padding:10px 14px;margin-bottom:8px;}
.zone-q .visuel{padding:8px;margin-bottom:6px;}

.zone-q .groupe{padding:4px;max-width:260px;}
.zone-q .astuce-compte,.zone-q .legende{margin:-2px 0 6px;font-size:13px;}
.zone-q .illu{font-size:34px;margin:0 0 4px;}
.zone-q .train{margin:0 0 6px;} .zone-q .loco{padding:4px 12px;} .zone-q .loco .avatar{font-size:30px;} .zone-q .loco .suj{font-size:13px;}
.zone-q .choix{gap:8px;}
.zone-q .choix button{min-height:50px;font-size:20px;}
.zone-q .choix.ballons{grid-template-columns:repeat(4,1fr);padding-bottom:14px;}
.zone-q .choix.ballons button{aspect-ratio:1/1.05;font-size:22px;}
.zone-q .choix.ballons button::after{height:14px;bottom:-14px;}
.zone-q .choix.wagons{gap:10px 16px;grid-template-columns:1fr 1fr;} .zone-q .choix.wagons button{min-height:48px;font-size:19px;} .zone-q .choix.wagons button:nth-child(3):last-child{grid-column:1 / -1;}
.zone-q .choix.intrus button{font-size:18px;padding:10px 12px;}

@media (orientation:landscape){
  .jeu-shell{grid-template-columns:minmax(0,56%) minmax(0,1fr);grid-template-rows:minmax(0,1fr);}
  .zone-q{padding:0 6px 8px 2px;}
  .zone-q .choix.ballons{grid-template-columns:repeat(2,1fr);}
  .zone-q .choix.ballons button{aspect-ratio:auto;min-height:56px;border-radius:999px;}
  .zone-q .choix.ballons button::after{display:none;}
}

.mot-dictee{display:block;cursor:pointer;padding:3px 0;border-bottom:1px dashed var(--bord);}
.mot-dictee:active{background:var(--fond2);}
.reecouter{width:100%;margin:0 0 10px;font-size:19px;background:var(--fond2);border-color:var(--dictee);color:var(--dictee);font-weight:700;}


.grille-box{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 10px;}
.grille-classe{border-collapse:separate;border-spacing:4px;width:max-content;min-width:100%;font-size:15px;}
.grille-classe th{background:var(--fond2);border:none;border-radius:10px;padding:8px 6px;text-align:center;font-weight:700;font-size:15px;color:var(--gris);}
.grille-classe th.courante{color:var(--encre);box-shadow:0 0 0 2px var(--jaune);}
.grille-classe th.lig{text-align:left;white-space:nowrap;min-width:92px;position:sticky;left:0;z-index:2;}
.grille-classe th.coin{background:none;position:sticky;left:0;z-index:2;}
.grille-classe td{border:none;padding:0;vertical-align:top;min-width:118px;max-width:150px;}
.grille-classe td button{width:100%;height:100%;min-height:118px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:10px 10px;font-size:14px;line-height:1.25;border-radius:12px;border:2px solid var(--bord);background:var(--carte);}
.grille-classe td button b{font-size:15px;}
.grille-classe td button span{color:var(--encre);}
.grille-classe td button .statut{margin-top:auto;font-size:13px;color:var(--gris);font-weight:700;}
.grille-classe td button .statut.jouer{color:var(--non);}
.grille-classe td.fait button{background:var(--ok-clair);border-color:var(--ok);}
.grille-classe td.fait button .statut{color:var(--ok);}
.grille-classe td.suivante button{border-color:var(--jaune);box-shadow:0 0 0 3px rgba(242,194,0,.45);animation:brille 1.8s ease-in-out infinite;}
.grille-classe td.bloque button{opacity:.45;border-style:dashed;cursor:not-allowed;}
.grille-classe td.vide{text-align:center;color:var(--gris);padding-top:40px;}
.grille-classe td.gagnee{background:var(--fond2);border-radius:10px;text-align:center;font-weight:700;padding:10px 4px;min-height:0;color:var(--gris);}
.grille-classe td.gagnee.fait{background:var(--ok-clair);color:var(--ok);}
@media (max-width:520px){ .grille-classe td{min-width:132px;} .grille-classe th.lig{min-width:74px;font-size:13px;} }


.correction{margin-top:10px;background:var(--ok-clair);border:2px solid var(--ok);border-radius:12px;padding:10px 14px;font-size:19px;}

.zone-q .choix button.faux{opacity:.5 !important;text-decoration:line-through;}

.onglets{display:flex;gap:6px;margin:4px 48px 12px 0;overflow-x:auto;padding-bottom:4px;}

.precision-tag{font-size:16px;background:var(--fond2);border-radius:999px;padding:2px 10px;color:var(--gris);vertical-align:middle;}


.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}

/* ===== interface tablette / manette ===== */
body{max-width:980px;padding:14px 18px 90px;touch-action:manipulation;user-select:none;-webkit-user-select:none;}
.pd-haut{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.pd-haut h1{flex:1;font-size:30px;}
.pd-btn{font:inherit;border:3px solid var(--bord);background:var(--carte);color:var(--encre);border-radius:18px;padding:14px 18px;font-size:22px;font-weight:600;cursor:pointer;min-height:64px;}
.pd-btn:active{transform:scale(.97);}
.pd-rond{width:64px;height:64px;padding:0;border-radius:50%;font-size:28px;flex:none;}
.pd-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.pd-tuile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:130px;border-radius:22px;padding:16px;}
.pd-tuile .ico{font-size:40px;line-height:1}
.pd-tuile b{font-size:21px;line-height:1.2}
.pd-tuile small{font-size:16px;color:var(--gris);font-weight:400}
.pd-etoiles{font-size:20px;letter-spacing:2px;color:#F2A900}
.pd-niv{display:flex;align-items:center;gap:12px;border:3px solid var(--bord);border-radius:20px;padding:12px;margin-bottom:12px;background:var(--carte);}
.pd-niv .txt{flex:1;min-width:0}
.pd-niv .code{display:inline-block;background:var(--fond2);border-radius:8px;padding:0 8px;font-size:15px;color:var(--gris);margin-right:6px}
.pd-niv b{font-size:20px}
.pd-niv small{display:block;color:var(--gris);font-size:15px;line-height:1.3}
.pd-choix{display:grid;gap:14px;grid-template-columns:1fr 1fr;}
.pd-choix.un{grid-template-columns:1fr;}
.pd-choix .pd-btn{min-height:84px;font-size:28px;border-width:4px;}
.pd-choix.un .pd-btn{font-size:22px;min-height:70px;}
.pd-choix .pd-btn.bon{background:var(--ok-clair);border-color:var(--ok);color:var(--ok);}
.pd-choix .pd-btn.faux{background:var(--non-clair);border-color:var(--non);color:var(--non);text-decoration:line-through;}
.pd-choix .pd-btn[disabled]{cursor:default}
.pd-prog{display:flex;gap:6px;margin:0 0 12px;}
.pd-prog span{flex:1;height:12px;border-radius:6px;background:var(--bord)}
.pd-prog span.ok{background:var(--ok)} .pd-prog span.ko{background:var(--non)} .pd-prog span.ici{background:#F2C200}
.pd-msg{font-size:22px;font-weight:700;margin:14px 0 6px;min-height:30px;text-align:center}
.pd-msg.ok{color:var(--ok)} .pd-msg.ko{color:var(--non)}
.pd-expl{font-size:18px;color:var(--gris);text-align:center;margin-bottom:10px}
.pd-suite{display:block;width:100%;margin-top:12px;background:#1565C0;color:#fff;border-color:#1565C0;font-size:26px}
.pd-fin{text-align:center;padding:20px 0}
.pd-fin .gros{font-size:80px;line-height:1.1}
.pd-fin .score{font-size:44px;font-weight:800;margin:6px 0}
.pd-aide{position:fixed;left:0;right:0;bottom:0;background:var(--fond2);border-top:1px solid var(--bord);font-size:15px;color:var(--gris);padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.pd-aide .k{display:inline-block;min-width:24px;height:24px;line-height:24px;border-radius:12px;text-align:center;color:#fff;font-weight:700;font-size:14px;margin-right:4px}
.k.a{background:#2E9E4F}.k.b{background:#D32F2F}.k.y{background:#F2A900}.k.d{background:#555;border-radius:6px;padding:0 6px}
body.nav .pd-f.focus{outline:5px solid #FF9800;outline-offset:3px;box-shadow:0 0 0 9px rgba(255,152,0,.25)}
body:not(.nav) .pd-aide .manette{display:none}
.pd-lecon{background:var(--carte);border:3px solid var(--bord);border-radius:20px;padding:16px;margin-bottom:14px;font-size:19px}
.obj{cursor:pointer}
</style>

let S = {best:{}};

const esc = t => String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const melange = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const etoiles = n => n==null ? '☆☆☆' : (n>=9?'★★★':n>=7?'★★☆':n>=5?'★☆☆':'☆☆☆');

let AC=null; function bip(ok){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination); const t=AC.currentTime;
  if(ok){ o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(880,t+.09); } else { o.frequency.setValueAtTime(220,t); o.frequency.setValueAtTime(180,t+.12); }
  g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); o.start(t); o.stop(t+.32); }catch(e){} }
function dire(txt){ try{ if(!window.speechSynthesis||!txt) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt.replace(/<[^>]+>/g,' ').replace(/\?/g,' ? ')); u.lang='fr-FR'; u.rate=.9;
  const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }

function nouvellePartie(mi, ni){ const m=JEU.mondes[mi], n=m.niveaux[ni]; const cle=m.id+':'+ni;
  const recents=new Set((S.recents&&S.recents[cle])||[]); let pool=n.Q.map((q,k)=>k).filter(k=>!recents.has(k)); if(pool.length<10) pool=n.Q.map((q,k)=>k);
  const ids=melange(pool).slice(0,10); S.recents=S.recents||{}; S.recents[cle]=ids.concat([...recents]).slice(0,Math.min(40,n.Q.length-10)); sauver();
  partie={mi, ni, cle, qs:ids.map(k=>{ const q=n.Q[k]; return Object.assign({}, q, {c: q.vf? q.c : melange(q.c)}); }), k:0, res:[], repondu:false};
  aller({nom:'jeu', m:mi, i:ni});
}

  ${q.k?`<p class="consigne">${esc(q.k.replace(/(le bon|les bons) (ballon|panneau|wagon)s?|la bonne carte/gi,'la bonne réponse').replace(/Touche les objets pour les compter\.?/,''))}</p>`:''}<div class="enonce">${q.e}</div>
  <div class="pd-choix ${un?'un':''}">${q.c.map((c,i)=>`<button class="pd-btn pd-f" data-act="rep" data-i="${i}">${esc(c)}</button>`).join('')}</div>
  <div id="retour"></div>`;
}
function repondre(i){ if(partie.repondu) return; const q=partie.qs[partie.k]; const ch=q.c[i]; const ok = ch===q.r; partie.repondu=true; partie.res.push(ok); bip(ok);
  document.querySelectorAll('[data-act="rep"]').forEach(b=>{ const v=q.c[+b.dataset.i]; b.disabled=true; b.classList.remove('pd-f'); if(v===q.r) b.classList.add('bon'); else if(+b.dataset.i===i) b.classList.add('faux'); });
  document.getElementById('retour').innerHTML = ok ? `<div class="pd-msg ok">✅ Bravo !</div>` : `<div class="pd-msg ko">Presque ! La bonne réponse : ${esc(q.r)}</div>${q.x?`<div class="pd-expl">${esc(q.x)}</div>`:''}<button class="pd-btn pd-suite pd-f" data-act="suivant">Suivant ▶</button>`;
  document.querySelectorAll('.pd-prog span')[partie.k].className = ok?'ok':'ko';
  brancher(); if(ok) setTimeout(suivant, 900); else focusDefaut();
}
function suivant(){ if(!partie||vue.nom!=='jeu'||!partie.repondu) return; partie.k++; partie.repondu=false;
  if(partie.k>=partie.qs.length){ const sc=partie.res.filter(Boolean).length; const old=S.best[partie.cle]; if(old==null||sc>old) S.best[partie.cle]=sc; sauver(); aller({nom:'fin', m:partie.mi, i:partie.ni, sc}); } else rendre(); }
function ecranFin(){ const sc=vue.sc; const m=JEU.mondes[vue.m];
  return `<div class="pd-fin"><div class="gros">${sc>=9?'🏆':sc>=7?'🎉':sc>=5?'👍':'💪'}</div><div class="score">${sc} / 10</div><div class="pd-etoiles" style="font-size:42px">${etoiles(sc)}</div>
  <p class="sous">${sc>=9?'Super ! Niveau réussi.':sc>=7?'Très bien ! Encore une partie pour les 3 étoiles ?':'On recommence : relis la fiche si besoin.'}</p>
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="pd-btn pd-f" data-act="jouer" data-i="${vue.i}" style="background:#1565C0;color:#fff;border-color:#1565C0">🔁 Rejouer</button>${m.niveaux[vue.i].lecon?`<button class="pd-btn pd-f" data-act="lecon" data-i="${vue.i}">📖 Fiche</button>`:''}<button class="pd-btn pd-f" data-act="retour">↩ Les niveaux</button></div></div>`;
}
function retour(){ if(vue.nom==='jeu'||vue.nom==='fin'||vue.nom==='lecon') aller({nom:'monde', m:vue.m}); else if(vue.nom==='monde') aller({nom:'accueil'}); }
function action(b){ const a=b.dataset.act, i=+b.dataset.i;
  if(a==='monde') aller({nom:'monde', m:i}); else if(a==='lecon') aller({nom:'lecon', m:vue.m, i}); else if(a==='jouer') nouvellePartie(vue.m, i);
  else if(a==='retour'||a==='quitter') retour(); else if(a==='rep') repondre(i); else if(a==='suivant') suivant();
  else if(a==='ecouter'){ const q=partie.qs[partie.k]; dire(q.t || q.e); } }
function brancher(){ document.querySelectorAll('[data-act]').forEach(b=>{ b.onclick=()=>{ document.body.classList.remove('nav'); action(b); }; }); }
// ---------- navigation à la manette / au clavier (déplacement spatial) ----------
let focusEl=null;
function focusables(){ return [...document.querySelectorAll('.pd-f')].filter(b=>!b.disabled && b.offsetParent!==null); }
function poser(el){ if(focusEl) focusEl.classList.remove('focus'); focusEl=el; if(el){ el.classList.add('focus'); el.scrollIntoView({block:'nearest', behavior:'smooth'}); } }
function focusDefaut(){ const L=focusables(); const pref = document.querySelector('.pd-f[data-act="suivant"]') || document.querySelector('.pd-f[data-act="rep"]') || document.querySelector('.pd-f[data-act="jouer"]') || L.find(b=>b.dataset.act!=='retour'&&b.dataset.act!=='quitter') || L[0]; poser(pref||null); }
function bouger(dx,dy){ document.body.classList.add('nav'); const L=focusables(); if(!L.length) return; if(!focusEl||!L.includes(focusEl)){ poser(L[0]); return; }
  const r=focusEl.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; let best=null, bd=1e9;
  L.forEach(b=>{ if(b===focusEl) return; const q=b.getBoundingClientRect(), x=q.left+q.width/2-cx, y=q.top+q.height/2-cy; const av = dx? x*dx : y*dy; if(av<=4) return; const lat = dx? Math.abs(y) : Math.abs(x); const d=av+lat*2.2; if(d<bd){ bd=d; best=b; } });
  if(best) poser(best); }
function valider(){ document.body.classList.add('nav'); if(focusEl&&!focusEl.disabled) action(focusEl); else focusDefaut(); }
document.addEventListener('keydown', e=>{ const k=e.key;
  if(k==='ArrowLeft'){bouger(-1,0);e.preventDefault();} else if(k==='ArrowRight'){bouger(1,0);e.preventDefault();} else if(k==='ArrowUp'){bouger(0,-1);e.preventDefault();} else if(k==='ArrowDown'){bouger(0,1);e.preventDefault();}
  else if(k==='Enter'||k===' '){ valider(); e.preventDefault(); } else if(k==='Escape'||k==='Backspace'){ document.body.classList.add('nav'); retour(); e.preventDefault(); }
  else if(/^[1-4]$/.test(k) && vue.nom==='jeu'){ const b=document.querySelector(`[data-act="rep"][data-i="${+k-1}"]`); if(b&&!b.disabled) repondre(+k-1); } });
const avant={}; let repet=0;
function manette(){ const pads=navigator.getGamepads?navigator.getGamepads():[]; let gp=null; for(const p of pads){ if(p&&p.connected){ gp=p; break; } }
  if(gp){ const B=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed); const ax=gp.axes||[]; const now=performance.now();
    const etat={a:B(0), b:B(1), y:B(3), x:B(2), st:B(9), up:B(12)||ax[1]<-.55, down:B(13)||ax[1]>.55, left:B(14)||ax[0]<-.55, right:B(15)||ax[0]>.55};
    const front=k=>etat[k]&&!avant[k];
    if(front('a')) valider(); if(front('b')){ document.body.classList.add('nav'); retour(); } if(front('y')&&vue.nom==='jeu'){ const q=partie.qs[partie.k]; dire(q.t||q.e); }
    const dir = etat.up?[0,-1]:etat.down?[0,1]:etat.left?[-1,0]:etat.right?[1,0]:null;
    if(dir){ const nouv = !(avant.up||avant.down||avant.left||avant.right); if(nouv||now>repet){ bouger(dir[0],dir[1]); repet=now+(nouv?380:160); } }
    Object.assign(avant, etat); }
  requestAnimationFrame(manette); }
window.addEventListener('gamepadconnected', ()=>{ document.body.classList.add('nav'); focusDefaut(); });
requestAnimationFrame(manette);
rendre();
</script>
