<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Maths</title>
<style>:root{--fond:#F4F8FF;--encre:#1C1C1C;--carte:#fff;--bord:#D6E0F0}@media (prefers-color-scheme:dark){:root{--fond:#121821;--encre:#F2F2F2;--carte:#1B2330;--bord:#2C3A4F}}
body{margin:0;min-height:100vh;background:var(--fond);color:var(--encre);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
h1{font-size:34px;margin:0 0 20px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;width:100%;max-width:620px}
a{display:block;text-decoration:none;color:inherit;background:var(--carte);border:3px solid var(--bord);border-radius:24px;padding:26px;text-align:center;font-size:26px;font-weight:700}a span{display:block;font-size:56px}a:focus{outline:5px solid #FF9800}</style></head>
<body><h1>🧮 Maths</h1><div class="g"><a href="ce1/"><span>🐣</span>Maths CE1</a><a href="cm2/"><span>🚀</span>Maths CM2</a></div>
<script>const L=[...document.querySelectorAll('a')];let i=0,av={};function f(){L[i].focus()}addEventListener('keydown',e=>{if(/Arrow(Right|Down)/.test(e.key)){i=(i+1)%L.length;f()}if(/Arrow(Left|Up)/.test(e.key)){i=(i+L.length-1)%L.length;f()}});
(function p(){const g=[...(navigator.getGamepads?navigator.getGamepads():[])].find(x=>x&&x.connected);if(g){const b=k=>g.buttons[k]&&g.buttons[k].pressed;const s={a:b(0),r:b(15)||b(13)||g.axes[0]>.55,l:b(14)||b(12)||g.axes[0]<-.55};if(s.r&&!av.r){i=(i+1)%L.length;f()}if(s.l&&!av.l){i=(i+L.length-1)%L.length;f()}if(s.a&&!av.a)L[i].click();av=s}requestAnimationFrame(p)})();</script></body></html>
